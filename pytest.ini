[pytest]
timeout = 60
markers =
    live_http: test makes live HTTP calls to a running server (grandfathered in tests/.live-http-allowlist).
              Use -m "not live_http" to exclude these from the baseline-delta gate so counts are
              deterministic across runs (issue #2339). The live_http marker is applied automatically
              by the root conftest.py to all files in tests/.live-http-allowlist — individual test
              files do not need to add it explicitly.
