function _smgmtUpdateSelectionUI() {
  const count = _smgmtSelectedIssues.size;

  // Inline selection bar (lives inside smgmt-sprint-list as first child)
  let bar = document.getElementById('smgmt-selection-bar');
  const listEl = document.getElementById('smgmt-sprint-list');

  if (count > 0) {
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'smgmt-selection-bar';
      bar.className = 'smgmt-selection-bar';
      bar.setAttribute('role', 'status');
      bar.setAttribute('aria-live', 'polite');
      // Build interior once
      bar.innerHTML = `
        <i class="ti ti-checkbox"></i>
        <strong class="smgmt-selection-bar-count" id="smgmt-sel-count">0 tickets selected</strong>
        <span style="color:var(--text-muted)">— batch move to a sprint or backlog</span>
        <div class="smgmt-sel-bar-actions">
          <button class="smgmt-selection-bar-deselect" onclick="_smgmtClearSelection()">
            <i class="ti ti-x"></i> Deselect all
          </button>
          <button class="smgmt-move-to-btn" id="smgmt-move-to-btn"
                  onclick="_smgmtToggleMoveToMenu(event)">
            Move to &#9660;
          </button>
          <div class="smgmt-move-to-menu" id="smgmt-move-to-menu"></div>
        </div>`;
      if (listEl) listEl.insertBefore(bar, listEl.firstChild);
    }
    bar.classList.add('show');
    const countEl = document.getElementById('smgmt-sel-count');
    if (countEl) countEl.textContent = count === 1 ? '1 ticket selected' : `${count} tickets selected`;
    _smgmtPopulateMoveToMenu();
  } else {
    if (bar) bar.classList.remove('show');
  }

  // Toolbar deselect button
  const deselectBtn = document.getElementById('smgmt-deselect-btn');
  if (deselectBtn) {
    deselectBtn.classList.toggle('visible', count > 0);
    const countSpan = document.getElementById('smgmt-deselect-count');
    if (countSpan) countSpan.textContent = String(count);
  }
}

function _smgmtPopulateSelectionDropdown() {
  // legacy no-op — replaced by _smgmtPopulateMoveToMenu
}

function _smgmtPopulateMoveToMenu() {
  const menu = document.getElementById('smgmt-move-to-menu');
  if (!menu || !_smgmtData) return;
  const sprints = (_smgmtData.sprints || []).sort((a, b) => a - b);
  let html = '';
  sprints.forEach(n => {
    html += `<button class="smgmt-move-to-item" onclick="_smgmtMoveSelectedTo('sprint-${n}');_smgmtCloseMoveToMenu()">Sprint ${n}</button>`;
  });
  html += `<button class="smgmt-move-to-item" onclick="_smgmtMoveSelectedTo('backlog');_smgmtCloseMoveToMenu()">Backlog (no sprint)</button>`;
  menu.innerHTML = html;
}

function _smgmtToggleMoveToMenu(event) {
  event.stopPropagation();
  const menu = document.getElementById('smgmt-move-to-menu');
  if (!menu) return;
  _smgmtPopulateMoveToMenu();
  menu.classList.toggle('open');
}

function _smgmtCloseMoveToMenu() {
  const menu = document.getElementById('smgmt-move-to-menu');
  if (menu) menu.classList.remove('open');
}

function _smgmtClearSelection() {
  _smgmtSelectedIssues.forEach(num => {
    const el = document.getElementById(`smgmt-ticket-${num}`);
    if (el) {
      el.classList.remove('is-selected');
      const cb = el.querySelector('.smgmt-ticket-cb');
      if (cb) cb.checked = false;
    }
  });
  _smgmtSelectedIssues.clear();
  _smgmtUpdateSelectionUI();
}

function _smgmtToggleSelect(number, checked) {
  if (checked) _smgmtSelectedIssues.add(number);
  else _smgmtSelectedIssues.delete(number);
  const el = document.getElementById(`smgmt-ticket-${number}`);
  if (el) el.classList.toggle('is-selected', checked);
  _smgmtUpdateSelectionUI();
}

async function _smgmtMoveSelectedTo(targetLabel) {
  if (!targetLabel || _smgmtSelectedIssues.size === 0) return;
  const repo = _smgmtRepo();
  if (!repo) return;

  const nums = Array.from(_smgmtSelectedIssues);
  const changes = nums.map(n => ({ issue_num: n, sprint_label: targetLabel }));

  // Optimistic UI update
  if (_smgmtData) {
    const targetNum = targetLabel === 'backlog' ? null : parseInt(targetLabel.split('-')[1], 10);
    nums.forEach(n => {
      const iss = _smgmtData.issues.find(i => i.number === n);
      if (iss) iss.sprint = targetNum;
    });
    _smgmtClearSelection();
    _smgmtRender(_smgmtData);
  }

  try {
    const res = await fetch('/api/sprints/batch-labels', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ changes, project: repo }),
    });
    if (!res.ok) throw new Error(await res.text());
    await loadSprintMgmt();
  } catch (e) {
    alert('Failed to move tickets: ' + e.message);
    await loadSprintMgmt();
  }
}

// ── Drag-and-drop ──────────────────────────────────────────────────────────
function _smgmtTicketDragStart(event, issueNum, fromSprint) {
  const isChecked = _smgmtSelectedIssues.has(issueNum);

  if (isChecked && _smgmtSelectedIssues.size > 1) {
    // Multi-ticket drag: pack all selected issue numbers
    const nums = Array.from(_smgmtSelectedIssues);
    const sprints = new Set(nums.map(n => {
      const iss = (_smgmtData?.issues || []).find(i => i.number === n);
      return iss ? iss.sprint : null;
    }));
    _smgmtDragTicket = {
      number: issueNum,
      fromSprint: fromSprint || null,
      multi: nums,
      multiSprints: sprints.size,
    };
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', nums.join(','));

    // Show floating pill
    const pill = document.getElementById('smgmt-drag-pill');
    if (pill) {
      const label = sprints.size > 1
        ? `Moving ${nums.length} tickets from ${sprints.size} sprints`
        : `Moving ${nums.length} tickets`;
      pill.textContent = label;
      pill.style.top = (event.clientY - 20) + 'px';
      pill.style.left = (event.clientX + 12) + 'px';
    }
    setTimeout(() => {
      nums.forEach(n => {
        const el = document.getElementById(`smgmt-ticket-${n}`);
        if (el) el.classList.add('dragging-ticket');
      });
    }, 0);
  } else {
    // Single-ticket drag (unchecked row or single selection)
    _smgmtDragTicket = { number: issueNum, fromSprint: fromSprint || null, multi: null };
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', String(issueNum));
    const el = document.getElementById(`smgmt-ticket-${issueNum}`);
    if (el) setTimeout(() => el.classList.add('dragging-ticket'), 0);
  }
}

function _smgmtDragMovePill(event) {
  if (_smgmtDragTicket?.multi) {
    const pill = document.getElementById('smgmt-drag-pill');
    if (pill && pill.textContent) {
      pill.style.top = (event.clientY - 20) + 'px';
      pill.style.left = (event.clientX + 12) + 'px';
    }
  }
}

function _smgmtTicketDragEnd(event) {
  if (_smgmtDragTicket) {
    if (_smgmtDragTicket.multi) {
      _smgmtDragTicket.multi.forEach(n => {
        const el = document.getElementById(`smgmt-ticket-${n}`);
        if (el) el.classList.remove('dragging-ticket');
      });
    } else {
      const el = document.getElementById(`smgmt-ticket-${_smgmtDragTicket.number}`);
      if (el) el.classList.remove('dragging-ticket');
    }
  }
  // Hide drag pill
  const pill = document.getElementById('smgmt-drag-pill');
  if (pill) { pill.style.top = '-100px'; pill.style.left = '-100px'; pill.textContent = ''; }
  _smgmtDragTicket = null;
  document.querySelectorAll('.smgmt-sprint-card').forEach(el => el.classList.remove('drag-over-sprint'));
}

function _smgmtDragOver(event, sprintLabel) {
  if (_smgmtDragTicket) {
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.smgmt-sprint-card').forEach(b => b.classList.remove('drag-over-sprint'));
    const target = document.getElementById(`smgmt-card-${sprintLabel}`);
    if (target) target.classList.add('drag-over-sprint');
  }
}

function _smgmtDragLeave(event) {
  if (event.currentTarget && !event.currentTarget.contains(event.relatedTarget)) {
    event.currentTarget.classList.remove('drag-over-sprint');
  }
}

async function _smgmtDropOnSprint(event, targetLabel) {
  event.preventDefault();
  document.querySelectorAll('.smgmt-sprint-card').forEach(el => el.classList.remove('drag-over-sprint'));

  if (!_smgmtDragTicket) return;
  const dragInfo = _smgmtDragTicket;
  _smgmtDragTicket = null;

  const repo = _smgmtRepo();
  if (!repo) return;

  if (dragInfo.multi && dragInfo.multi.length > 1) {
    // Multi-ticket drop
    const nums = dragInfo.multi;
    const targetNum = targetLabel ? parseInt(targetLabel.split('-')[1], 10) : null;

    // Optimistic update
    if (_smgmtData) {
      nums.forEach(n => {
        const iss = _smgmtData.issues.find(i => i.number === n);
        if (iss) iss.sprint = targetNum;
      });
    }
    // Clear selection before render
    _smgmtClearSelection();
    if (_smgmtData) _smgmtRender(_smgmtData);

    const changes = nums.map(n => ({ issue_num: n, sprint_label: targetLabel || 'backlog' }));
    try {
      const res = await fetch('/api/sprints/batch-labels', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ changes, project: repo }),
      });
      if (!res.ok) throw new Error(await res.text());
      await loadSprintMgmt();
    } catch (e) {
      alert(`Failed to move tickets: ${e.message}`);
      await loadSprintMgmt();
    }
  } else {
    // Single-ticket drop
    const { number, fromSprint } = dragInfo;
    if (fromSprint === targetLabel) return;

    const targetNum = targetLabel ? parseInt(targetLabel.split('-')[1], 10) : null;

    // Optimistic update
    if (_smgmtData) {
      const iss = _smgmtData.issues.find(i => i.number === number);
      if (iss) iss.sprint = targetNum;
      _smgmtRender(_smgmtData);
    }
    // Clear selection after any drag completes
    _smgmtClearSelection();

    try {
      const res = await fetch(`/api/issues/${number}/sprint-label`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sprint_label: targetLabel || 'backlog', project: repo }),
      });
      if (!res.ok) throw new Error(await res.text());
      await loadSprintMgmt();
    } catch (e) {
      // Rollback optimistic update
      if (_smgmtData) {
        const iss = _smgmtData.issues.find(i => i.number === number);
        if (iss) iss.sprint = fromSprint ? parseInt(fromSprint.split('-')[1], 10) : null;
        _smgmtRender(_smgmtData);
      }
      alert(`Failed to move ticket #${number}: ${e.message}`);
    }
  }
}

async function smgmtTriggerRefresh() {
  const btn = document.getElementById('smgmt-refresh-btn');

async function smgmtOpenNewTicket() {

  document.getElementById('nt-description').value = '';

    const currentRepo = _cachedFullRepo[_slug] || null;
    sel.innerHTML = projects.map(p =>
      `<option value="${escHtml(p.repo)}"${p.repo === currentRepo ? ' selected' : ''}>${escHtml(p.name || p.repo)}</option>`

function _ntClose() {

  document.getElementById('nt-modal').classList.add('hidden');
}

// ── Modal event-binding (called once from init after DOM is ready) ─────────
function _setupModals() {
  // Global Escape handler
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      if (!document.getElementById('ns-modal').classList.contains('hidden')) {
        _nsClose(false);
      } else if (!document.getElementById('nt-modal').classList.contains('hidden')) {
        _ntClose();
      } else if (_smgmtSelectedIssues.size > 0) {
        // Clear multi-select when Escape pressed and no modal is open
        _smgmtClearSelection();
      }
    }
  });

  // ── New Sprint modal wiring ──
  document.getElementById('ns-goal').addEventListener('input', function() {
    document.getElementById('ns-submit-btn').disabled = this.value.trim().length < 10;
  });

  document.getElementById('ns-close-btn').addEventListener('click', () => _nsClose(false));
  document.getElementById('ns-cancel-btn').addEventListener('click', () => _nsClose(false));
  document.getElementById('ns-backdrop').addEventListener('click', () => _nsClose(false));

  document.getElementById('ns-modal').addEventListener('keydown', function(e) {
    if (e.key !== 'Tab') return;
    const focusable = Array.from(this.querySelectorAll(
      'button:not([disabled]), textarea, input, [tabindex]:not([tabindex="-1"])'
    ));
    if (!focusable.length) return;
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (e.shiftKey) { if (document.activeElement === first) { e.preventDefault(); last.focus(); } }
    else            { if (document.activeElement === last)  { e.preventDefault(); first.focus(); } }
  });

  document.getElementById('ns-submit-btn').addEventListener('click', async function() {
    const goal = (document.getElementById('ns-goal').value || '').trim();
    if (goal.length < 10) return;

    const repo = _cachedFullRepo[_slug] || null;
    if (!repo) { _nsShowError('Project not found — please reload the page.'); return; }

    this.disabled = true;
    this.textContent = 'Creating…';
    document.getElementById('ns-error').classList.add('hidden');

    try {
      const resp = await fetch('/api/sprints/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ project: repo, goal }),
      });
      if (!resp.ok) {
        const data = await resp.json().catch(() => ({}));
        throw new Error(data.detail || 'HTTP ' + resp.status);
      }
      document.getElementById('ns-backdrop').classList.add('hidden');
      document.getElementById('ns-modal').classList.add('hidden');
      await loadSprintMgmt();
    } catch (err) {
      _nsShowError("Couldn't create sprint — " + err.message);
      this.disabled = false;
      this.textContent = 'Create Sprint';
    }
  });

  // ── New Ticket modal wiring ──
  document.getElementById('nt-close-btn').addEventListener('click', _ntClose);
  document.getElementById('nt-cancel-btn').addEventListener('click', _ntClose);
  document.getElementById('nt-backdrop').addEventListener('click', _ntClose);

  document.getElementById('nt-modal').addEventListener('keydown', function(e) {
    if (e.key !== 'Tab') return;
    const focusable = Array.from(this.querySelectorAll(
      'button:not([disabled]), select, textarea, input, [tabindex]:not([tabindex="-1"])'
    ));
    if (!focusable.length) return;
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (e.shiftKey) { if (document.activeElement === first) { e.preventDefault(); last.focus(); } }
    else            { if (document.activeElement === last)  { e.preventDefault(); first.focus(); } }
  });

  document.getElementById('nt-submit-btn').addEventListener('click', async function() {
    const repo = document.getElementById('nt-project').value;
    const description = (document.getElementById('nt-description').value || '').trim();
    if (!repo || !description) {
      document.getElementById('nt-error').textContent = 'Project and description are required.';
      document.getElementById('nt-error').classList.remove('hidden');
      return;
    }

    this.disabled = true;
    this.textContent = 'Submitting…';
    document.getElementById('nt-error').classList.add('hidden');

    try {
      const formData = new FormData();
      formData.append('description', description);
      formData.append('project', repo);
      const resp = await fetch('/api/tickets/draft', { method: 'POST', body: formData });
      if (!resp.ok) {
        const data = await resp.json().catch(() => ({}));
        throw new Error(data.detail || 'HTTP ' + resp.status);
      }
      // Draft generated — navigate to the project on main index to finish posting
      _ntClose();
      window.location.href = '/project/' + encodeURIComponent(repo) + '/sprint-mgmt';
    } catch (err) {
      document.getElementById('nt-error').textContent = "Couldn't create ticket — " + err.message;
      document.getElementById('nt-error').classList.remove('hidden');
      this.disabled = false;
      this.textContent = 'Generate Draft';
    }
  });
}

                placeholder="What should this sprint achieve? — e.g. Dashboard UX cleanup"
                aria-required="true"></textarea>
      <p class="modal-hint">The goal becomes the sprint label's description and the BA passes it to the coder/tester</p>
    </div>
    <div class="modal-error hidden" id="ns-error"></div>
  </div>
  <div class="modal-footer">
    <button class="btn-ghost" id="ns-cancel-btn" type="button">Cancel</button>
    <button class="btn-primary" id="ns-submit-btn" type="button" disabled>Create Sprint</button>
  </div>
</div>

<!-- ── New Ticket modal ── -->
<div class="modal-backdrop hidden" id="nt-backdrop"></div>
<div class="modal nt-modal hidden" id="nt-modal"
     role="dialog" aria-modal="true" aria-labelledby="nt-modal-title">
  <div class="modal-header">
    <span class="modal-title" id="nt-modal-title">New Ticket</span>
    <button class="modal-close" id="nt-close-btn" aria-label="Close">&times;</button>
  </div>
  <div class="modal-body">
    <div class="modal-field">
      <label class="modal-label" for="nt-project">Project <span style="color:var(--red)">*</span></label>
      <select class="modal-input" id="nt-project" aria-required="true"></select>
    </div>
    <div class="modal-field">
      <label class="modal-label" for="nt-description">Description <span style="color:var(--red)">*</span></label>
      <textarea class="modal-input nt-textarea" id="nt-description"
                rows="4"
                placeholder="Describe the feature or bug you want to file…"
                aria-required="true"></textarea>
    </div>
    <div class="modal-error hidden" id="nt-error"></div>
  </div>
  <div class="modal-footer">
    <button class="btn-ghost" id="nt-cancel-btn" type="button">Cancel</button>
    <button class="btn-primary" id="nt-submit-btn" type="button">Generate Draft</button>
  </div>
</div>

</body>
</html>
