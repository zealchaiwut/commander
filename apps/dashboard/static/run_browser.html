<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run Browser — Commander</title>
<script src="/static/log-colorize.js"></script>
<link rel="stylesheet" href="/static/css/tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d1117;
    --bg2:       #161b22;
    --bg3:       #21262d;
    --border:    #30363d;
    --text:      #e6edf3;
    --text-muted:#8b949e;
    --accent:    #388bfd;
    --fail:      #f85149;
    --pass:      #3fb950;
    --warn:      #d29922;
    --radius:    6px;
    --sp:        8px;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text);
               font: 14px/1.5 ui-monospace, "SFMono-Regular", Consolas, monospace; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ── layout ──────────────────────────────────────────────────────────────── */
  #app { display: flex; flex-direction: column; height: 100%; overflow-x: hidden; }

  /* top nav */
  #nav { display: flex; align-items: center; gap: var(--sp); padding: 10px 16px;
         background: var(--bg2); border-bottom: 1px solid var(--border);
         flex-shrink: 0; overflow-x: auto; white-space: nowrap; }
  #nav .crumb { color: var(--text-muted); cursor: pointer; }
  #nav .crumb:hover { color: var(--text); }
  #nav .sep { color: var(--border); }
  #nav .crumb.active { color: var(--text); }

  /* panels */
  #panels { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

  .panel { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .panel.hidden { display: none; }

  /* ── sprint list ─────────────────────────────────────────────────────────── */
  .sprint-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; margin-bottom: 6px;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer; user-select: none;
  }
  .sprint-item:hover { border-color: var(--accent); }
  .sprint-item.has-failures { border-left: 3px solid var(--fail); }
  .sprint-item.all-passing  { border-left: 3px solid var(--pass); }

  .sprint-name { font-weight: 600; }
  .sprint-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; padding: 2px 6px; border-radius: 10px;
    font-weight: 600; white-space: nowrap;
  }
  .badge-fail { background: rgba(248,81,73,.15); color: var(--fail); }
  .badge-pass { background: rgba(63,185,80,.15); color: var(--pass); }
  .badge-warn { background: rgba(210,153,34,.15); color: var(--warn); }

  /* ── ticket list ─────────────────────────────────────────────────────────── */
  .ticket-item {
    padding: 10px 12px; margin-bottom: 6px;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .ticket-item.has-failures { border-left: 3px solid var(--fail); }
  .ticket-item.all-passing  { border-left: 3px solid var(--pass); }
  .ticket-header { display: flex; align-items: center; justify-content: space-between; }
  .ticket-title  { font-weight: 600; }
  .agents-row    { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .agent-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 14px; cursor: pointer;
    font-size: 12px; border: 1px solid var(--border);
    background: var(--bg3); transition: border-color .15s;
  }
  .agent-chip:hover { border-color: var(--accent); }
  .agent-chip.outcome-failed  { border-color: var(--fail); background: rgba(248,81,73,.08); }
  .agent-chip.outcome-success,
  .agent-chip.outcome-passed  { border-color: var(--pass); background: rgba(63,185,80,.08); }
  .dur { color: var(--text-muted); font-size: 11px; }

  /* ── log pane ────────────────────────────────────────────────────────────── */
  #log-panel { display: flex; flex-direction: column; height: 100%; }
  #log-controls {
    display: flex; align-items: center; gap: var(--sp); padding: 8px 16px;
    background: var(--bg2); border-bottom: 1px solid var(--border); flex-shrink: 0;
    flex-wrap: wrap;
  }
  #log-controls button {
    padding: 4px 10px; border-radius: var(--radius);
    background: var(--bg3); color: var(--text); border: 1px solid var(--border);
    cursor: pointer; font-size: 12px;
  }
  #log-controls button:hover { border-color: var(--accent); }
  #log-controls button:disabled { opacity: .4; cursor: default; }
  #log-page-info { font-size: 12px; color: var(--text-muted); }

  #log-content {
    flex: 1; overflow-y: auto; padding: 12px 16px; font-size: 12px;
    line-height: 1.6; white-space: pre-wrap; word-break: break-all;
  }
  .log-line { display: block; }
  .log-line:hover { background: var(--bg3); }

  /* log chip styles (from log-colorize.js) */
  .log-chip { padding: 0 5px; border-radius: 3px; font-size: 11px; font-weight: 600; }
  .log-chip--issue { background: rgba(56,139,253,.2); color: #79c0ff; }
  .log-chip--agent { padding: 0 5px; border-radius: 3px; }
  .log-agent-coder     { background: rgba(56,139,253,.2); color: #79c0ff; }
  .log-agent-tester    { background: rgba(63,185,80,.2);  color: #56d364; }
  .log-agent-reviewer  { background: rgba(163,113,247,.2);color: #d2a8ff; }
  .log-agent-documenter{ background: rgba(210,153,34,.2); color: #e3b341; }
  .log-agent-estimator { background: rgba(56,189,200,.2); color: #39d0d8; }
  .log-agent-ba        { background: rgba(255,131,192,.2);color: #ff83c0; }

  /* loading / error */
  .msg { color: var(--text-muted); padding: 24px 0; text-align: center; }
  .err { color: var(--fail); padding: 24px 0; text-align: center; }

  /* ── mobile (<= 390 px) ──────────────────────────────────────────────────── */
  @media (max-width: 390px) {
    #nav { padding: 8px 10px; font-size: 12px; }
    .panel { padding: 8px 10px; }
    .sprint-item, .ticket-item { padding: 8px 10px; }
    #log-content { font-size: 11px; padding: 8px 10px; }
    #log-controls { padding: 6px 10px; }
    .agent-chip { padding: 4px 8px; font-size: 11px; }
  }
</style>
</head>
<body>
<div id="app">
  <!-- breadcrumb nav -->
  <div id="nav">
    <span class="crumb active" id="nav-home" onclick="navTo('sprints')">Run Browser</span>
    <span class="sep" id="nav-sep1" style="display:none">›</span>
    <span class="crumb" id="nav-sprint" style="display:none"></span>
    <span class="sep" id="nav-sep2" style="display:none">›</span>
    <span class="crumb" id="nav-ticket" style="display:none"></span>
    <span class="sep" id="nav-sep3" style="display:none">›</span>
    <span class="crumb" id="nav-agent" style="display:none"></span>
  </div>

  <!-- panels container -->
  <div id="panels">
    <!-- Sprint list panel -->
    <div class="panel" id="panel-sprints">
      <div class="msg" id="sprints-loading">Loading runs…</div>
      <div id="sprints-list"></div>
    </div>

    <!-- Ticket list panel -->
    <div class="panel hidden" id="panel-tickets">
      <div id="tickets-list"></div>
    </div>

    <!-- Log panel -->
    <div id="log-panel" class="hidden">
      <div id="log-controls">
        <button id="btn-prev" onclick="logPage(-1)" disabled>← Prev</button>
        <button id="btn-next" onclick="logPage(1)">Next →</button>
        <button onclick="logTail()">Tail</button>
        <span id="log-page-info"></span>
      </div>
      <div id="log-content"></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ── state ──────────────────────────────────────────────────────────────────
  var _runs = [];
  var _currentSprint = null;
  var _currentIssue  = null;
  var _currentAgent  = null;
  var _logOffset = 0;
  var _logLimit  = 200;
  var _logTotal  = 0;

  // ── init ───────────────────────────────────────────────────────────────────
  function init() {
    fetchRuns();
    // Check for deep-link ?sprint=<label> in URL
    var params = new URLSearchParams(window.location.search);
    var deepSprint = params.get('sprint');
    if (deepSprint) {
      // Wait for runs to load then auto-navigate
      window._deepSprint = deepSprint;
    }
  }

  // ── data fetch ─────────────────────────────────────────────────────────────
  function fetchRuns() {
    fetch('/runs')
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (data) {
        _runs = data;
        renderSprints();
        // Handle deep-link
        if (window._deepSprint) {
          var target = _runs.find(function (s) { return s.sprint === window._deepSprint; });
          if (target) { selectSprint(target); }
          window._deepSprint = null;
        }
      })
      .catch(function (e) {
        document.getElementById('sprints-loading').className = 'err';
        document.getElementById('sprints-loading').textContent = 'Failed to load runs: ' + e;
      });
  }

  // ── sprint list ────────────────────────────────────────────────────────────
  function renderSprints() {
    var container = document.getElementById('sprints-list');
    var loading   = document.getElementById('sprints-loading');
    loading.style.display = 'none';
    container.innerHTML   = '';

    if (_runs.length === 0) {
      container.innerHTML = '<div class="msg">No runs recorded yet.</div>';
      return;
    }

    _runs.forEach(function (sp) {
      var div  = document.createElement('div');
      var cls  = 'sprint-item' + (sp.failed_count > 0 ? ' has-failures' : ' all-passing');
      div.className = cls;
      div.onclick   = function () { selectSprint(sp); };

      var meta = sp.failed_count + ' failed / ' + sp.total_count + ' total';
      if (sp.ended_at) meta += ' · ' + sp.ended_at.slice(0, 10);

      var badgeHtml = sp.failed_count > 0
        ? '<span class="badge badge-fail">' + sp.failed_count + ' failed</span>'
        : '<span class="badge badge-pass">all passed</span>';

      div.innerHTML =
        '<div>' +
          '<div class="sprint-name">' + esc(sp.sprint) + '</div>' +
          '<div class="sprint-meta">' + esc(meta) + '</div>' +
        '</div>' +
        '<div>' + badgeHtml + '</div>';
      container.appendChild(div);
    });
  }

  function selectSprint(sp) {
    _currentSprint = sp;
    _currentIssue  = null;
    _currentAgent  = null;
    showPanel('tickets');
    updateNav();
    renderTickets(sp);
  }

  // ── ticket list ────────────────────────────────────────────────────────────
  function renderTickets(sp) {
    var container = document.getElementById('tickets-list');
    container.innerHTML = '';

    if (!sp.tickets || sp.tickets.length === 0) {
      container.innerHTML = '<div class="msg">No tickets in this sprint.</div>';
      return;
    }

    sp.tickets.forEach(function (ticket) {
      var div = document.createElement('div');
      var cls = 'ticket-item' + (isFailedTicket(ticket) ? ' has-failures' : ' all-passing');
      div.className = cls;

      var agentsHtml = (ticket.agents || []).map(function (a) {
        var oc  = (a.outcome || '').toLowerCase();
        var acls = 'agent-chip outcome-' + oc;
        var dur  = a.duration_seconds ? formatDur(a.duration_seconds) : '—';
        return '<span class="' + acls + '" onclick="selectAgent(' +
          JSON.stringify(ticket.issue_number) + ',' + JSON.stringify(a.agent) +
          ');event.stopPropagation()">' +
          '<span>' + esc(a.agent) + '</span>' +
          '<span class="dur">' + esc(dur) + '</span>' +
          '</span>';
      }).join('');

      var outcomeHtml = isFailedTicket(ticket)
        ? '<span class="badge badge-fail">failed</span>'
        : '<span class="badge badge-pass">passed</span>';

      div.innerHTML =
        '<div class="ticket-header">' +
          '<span class="ticket-title">Issue #' + ticket.issue_number + '</span>' +
          outcomeHtml +
        '</div>' +
        '<div class="agents-row">' + agentsHtml + '</div>';

      container.appendChild(div);
    });
  }

  function isFailedTicket(ticket) {
    return (ticket.agents || []).some(function (a) {
      var oc = (a.outcome || '').toLowerCase();
      return oc === 'failed' || oc === 'failure' || oc === 'needs-rework';
    });
  }

  function selectAgent(issueNum, agent) {
    _currentIssue  = issueNum;
    _currentAgent  = agent;
    _logOffset     = 0;
    showPanel('log');
    updateNav();
    loadLogPage();
  }

  // ── log panel ──────────────────────────────────────────────────────────────
  function loadLogPage() {
    var sprint = _currentSprint.sprint;
    var issue  = _currentIssue;
    var agent  = _currentAgent;
    var url    = '/runs/' + encodeURIComponent(sprint) +
                 '/' + issue + '/' + encodeURIComponent(agent) +
                 '/log?offset=' + _logOffset + '&limit=' + _logLimit;

    document.getElementById('log-content').textContent = 'Loading…';
    fetch(url)
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (data) {
        _logTotal = data.total_lines || 0;
        renderLogLines(data.lines || []);
        updateLogControls();
      })
      .catch(function (e) {
        document.getElementById('log-content').textContent = 'Error loading log: ' + e;
      });
  }

  function logPage(dir) {
    var next = _logOffset + dir * _logLimit;
    if (next < 0) next = 0;
    if (next >= _logTotal) return;
    _logOffset = next;
    loadLogPage();
  }

  function logTail() {
    var sprint = _currentSprint.sprint;
    var issue  = _currentIssue;
    var agent  = _currentAgent;
    var url    = '/runs/' + encodeURIComponent(sprint) +
                 '/' + issue + '/' + encodeURIComponent(agent) +
                 '/log/tail?kb=32';

    document.getElementById('log-content').textContent = 'Loading tail…';
    fetch(url)
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (data) {
        var lines = (data.content || '').split('\n');
        renderLogLines(lines);
        updateLogControls();
      })
      .catch(function (e) {
        document.getElementById('log-content').textContent = 'Error loading tail: ' + e;
      });
  }

  function renderLogLines(lines) {
    var container = document.getElementById('log-content');
    container.innerHTML = '';
    lines.forEach(function (line) {
      var span = document.createElement('span');
      span.className = 'log-line';
      span.innerHTML = colorizeLogLine(line, null);
      container.appendChild(span);
    });
  }

  function updateLogControls() {
    document.getElementById('btn-prev').disabled = _logOffset === 0;
    document.getElementById('btn-next').disabled = _logOffset + _logLimit >= _logTotal;
    document.getElementById('log-page-info').textContent =
      'Lines ' + _logOffset + '–' + Math.min(_logOffset + _logLimit, _logTotal) +
      ' of ' + _logTotal;
  }

  // ── navigation ─────────────────────────────────────────────────────────────
  function showPanel(name) {
    var panels = ['sprints', 'tickets', 'log'];
    panels.forEach(function (p) {
      var el = document.getElementById('panel-' + p) ||
               document.getElementById(p === 'log' ? 'log-panel' : 'panel-' + p);
      if (!el) return;
      if (p === name) {
        el.classList.remove('hidden');
      } else {
        el.classList.add('hidden');
      }
    });
  }

  function navTo(target) {
    if (target === 'sprints') {
      _currentSprint = null;
      _currentIssue  = null;
      _currentAgent  = null;
      showPanel('sprints');
      updateNav();
    } else if (target === 'tickets' && _currentSprint) {
      _currentIssue = null;
      _currentAgent = null;
      showPanel('tickets');
      updateNav();
    }
  }

  function updateNav() {
    var home    = document.getElementById('nav-home');
    var sep1    = document.getElementById('nav-sep1');
    var sprint  = document.getElementById('nav-sprint');
    var sep2    = document.getElementById('nav-sep2');
    var ticket  = document.getElementById('nav-ticket');
    var sep3    = document.getElementById('nav-sep3');
    var agentEl = document.getElementById('nav-agent');

    // Reset
    [sep1,sprint,sep2,ticket,sep3,agentEl].forEach(function (el) { el.style.display='none'; });
    home.className = 'crumb';

    if (_currentSprint) {
      sep1.style.display = '';
      sprint.style.display = '';
      sprint.textContent = _currentSprint.sprint;
      sprint.className = 'crumb' + (_currentIssue ? '' : ' active');
      sprint.onclick = function () { navTo('tickets'); };
    }
    if (_currentIssue != null) {
      sep2.style.display = '';
      ticket.style.display = '';
      ticket.textContent = '#' + _currentIssue;
      ticket.className = 'crumb' + (_currentAgent ? '' : ' active');
      ticket.onclick = function () { navTo('tickets'); };
    }
    if (_currentAgent) {
      sep3.style.display = '';
      agentEl.style.display = '';
      agentEl.textContent = _currentAgent;
      agentEl.className = 'crumb active';
    }
    if (!_currentSprint) {
      home.className = 'crumb active';
    }
  }

  // ── utils ──────────────────────────────────────────────────────────────────
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatDur(secs) {
    if (secs < 60)  return secs + 's';
    if (secs < 3600) return Math.round(secs / 60) + 'm';
    return (secs / 3600).toFixed(1) + 'h';
  }

  // ── boot ───────────────────────────────────────────────────────────────────
  init();
})();
</script>
</body>
</html>
