<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <!-- impeccable-disable low-contrast, single-font, em-dash-overuse -- pre-existing violations, scoped per-file (issue #1205) -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System diagnostics — Commander</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <style>
    /* ── Variables ── */
    :root {
      --bg:           #f9fafb;
      --surface:      #ffffff;
      --surface-2:    #f3f4f6;
      --surface-hover:#f5f6f8;
      --border:       #e5e7eb;
      --text:         #111827;
      --text-muted:   #6b7280;
      --text-sub:     #9ca3af;
      --green:        #16a34a;
      --green-bg:     #dcfce7;
      --amber:        #d97706;
      --amber-bg:     #fef3c7;
      --red:          #dc2626;
      --red-bg:       #fee2e2;
      --blue:         #2563eb;
      --blue-bg:      #dbeafe;
      --purple:       #7c3aed;
      --purple-bg:    #ede9fe;
      --mono: 'SF Mono','Fira Code','Cascadia Code',monospace;
    }

    [data-theme="dark"] {
      --bg:           #0d0d0d;
      --surface:      #161616;
      --surface-2:    #1e1e1e;
      --surface-hover:#222222;
      --border:       #2a2a2a;
      --text:         #e5e7eb;
      --text-muted:   #9ca3af;
      --text-sub:     #6b7280;
      --green:        #22c55e;
      --green-bg:     rgba(34,197,94,.13);
      --amber:        #eab308;
      --amber-bg:     rgba(234,179,8,.13);
      --red:          #f87171;
      --red-bg:       rgba(239,68,68,.13);
      --blue:         #60a5fa;
      --blue-bg:      rgba(96,165,250,.13);
      --purple:       #a78bfa;
      --purple-bg:    rgba(167,139,250,.13);
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    button { font-family: inherit; cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    /* ── Header (app shell) ── */
    .header {
      position: sticky; top: 0; z-index: 20;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 52px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      width: 28px; height: 28px; border-radius: 7px;
      background: var(--text);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: var(--surface); font-size: 15px;
      text-decoration: none;
    }
    .header-wordmark { font-size: 15px; font-weight: 700; letter-spacing: -.02em; }
    .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .btn-icon {
      min-width: 44px; min-height: 44px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); border-radius: 6px; background: none;
      color: var(--text-muted); font-size: 15px;
      transition: background .15s, color .15s;
    }
    .btn-icon:hover { background: var(--surface-2); color: var(--text); }

    /* Health icon: pulseDot animation when system is down */
    @keyframes pulseDot {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(0.9); }
    }
    #header-health-icon.health-down {
      animation: pulseDot 1s ease-in-out infinite;
    }

    /* Tooltip */
    [data-tooltip] { position: relative; }
    [data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
      background: #1a1a1a; color: #f0f0f0; font-size: 11px; font-weight: 400;
      padding: 5px 9px; border-radius: 5px; white-space: nowrap;
      pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 100;
    }
    [data-tooltip]:hover::after { opacity: 1; }

    /* ── Page content ── */
    .page-content {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ── Page heading ── */
    .page-heading {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.02em;
      color: var(--text);
    }

    /* ── Status banner ── */
    .status-banner {
      border-radius: 10px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .status-banner.banner-ok      { background: var(--green-bg); border: 1px solid rgba(22,163,74,.25); }
    .status-banner.banner-degraded { background: var(--amber-bg); border: 1px solid rgba(217,119,6,.25); }
    .status-banner.banner-down    { background: var(--red-bg);   border: 1px solid rgba(220,38,38,.25); }
    .status-banner.banner-unknown { background: var(--surface-2); border: 1px solid var(--border); }

    .banner-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .banner-icon { font-size: 24px; flex-shrink: 0; }
    .banner-text { min-width: 0; }
    .banner-label {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
    }
    .banner-label.label-ok       { color: var(--green); }
    .banner-label.label-degraded { color: var(--amber); }
    .banner-label.label-down     { color: var(--red); }
    .banner-label.label-unknown  { color: var(--text-muted); }
    .banner-timestamp {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .banner-right { flex-shrink: 0; }
    .btn-refresh {
      min-width: 44px; min-height: 44px;
      padding: 0 18px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      display: flex; align-items: center; gap: 6px;
      transition: background .15s, opacity .15s;
    }
    .btn-refresh:hover { background: var(--surface-2); }
    .btn-refresh:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Host doctor (issue #828) ── */
    .doctor-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
    }
    .doctor-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
    }
    .doctor-title { font-size: 14px; font-weight: 700; }
    .doctor-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .doctor-results { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
    .doctor-results:empty { display: none; }
    .doctor-row {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .doctor-row.is-pass { background: var(--green-bg); border-color: rgba(22,163,74,.25); }
    .doctor-row.is-fail { background: var(--red-bg);   border-color: rgba(220,38,38,.25); }
    .doctor-row-top { display: flex; align-items: center; gap: 8px; }
    .doctor-badge {
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      letter-spacing: .03em; flex-shrink: 0;
    }
    .doctor-row.is-pass .doctor-badge { color: var(--green); }
    .doctor-row.is-fail .doctor-badge { color: var(--red); }
    .doctor-name { font-size: 13px; font-weight: 600; }
    .doctor-detail { font-size: 12px; color: var(--text-muted); font-family: var(--mono); word-break: break-word; }
    .doctor-fix { font-size: 12px; color: var(--text); word-break: break-word; }
    .doctor-fix strong { color: var(--red); }

    /* Unreachable banner */
    .unreachable-banner {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .unreachable-banner.hidden { display: none; }
    .unreachable-banner i { font-size: 16px; color: var(--amber); flex-shrink: 0; }

    /* ── Check card grid ── */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 768px) {
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 1024px) {
      .cards-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* ── Check card ── */
    .check-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 44px; /* touch-friendly */
    }
    .check-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .check-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }
    .check-status-indicator {
      font-size: 28px;
      flex-shrink: 0;
      line-height: 1;
    }
    .check-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .check-detail-line {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .check-hint {
      margin-top: 4px;
      padding: 10px 12px;
      border-radius: 6px;
      background: var(--red-bg);
      border: 1px solid rgba(220,38,38,.2);
      font-size: 12px;
      color: var(--red);
      font-family: var(--mono);
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .check-hint.hint-amber {
      background: var(--amber-bg);
      border-color: rgba(217,119,6,.2);
      color: var(--amber);
    }

    /* ── Loading skeleton ── */
    .skel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .skel {
      background: var(--surface-2);
      border-radius: 4px;
      animation: shimmer 1.5s ease-in-out infinite;
    }
    .skel-title { height: 18px; width: 60%; }
    .skel-line  { height: 13px; width: 80%; }
    .skel-line2 { height: 13px; width: 50%; }
    @keyframes shimmer {
      0%,100% { opacity: 1; }
      50%      { opacity: .5; }
    }

    /* ── Debug section ── */
    .debug-section {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      overflow: hidden;
    }
    .debug-toggle {
      width: 100%;
      padding: 14px 18px;
      background: none;
      border: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      min-height: 44px;
      transition: background .15s;
    }
    .debug-toggle:hover { background: var(--surface-hover); }
    .debug-toggle-chevron { transition: transform .2s ease; font-size: 14px; }
    .debug-toggle.expanded .debug-toggle-chevron { transform: rotate(180deg); }

    .debug-body {
      display: none;
      padding: 0 18px 18px;
      border-top: 1px solid var(--border);
    }
    .debug-body.open { display: block; }

    .debug-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .debug-row:last-child { border-bottom: none; }
    .debug-label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .debug-value {
      font-size: 12px;
      color: var(--text-sub);
      font-family: var(--mono);
      max-width: 60%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-copy {
      min-width: 44px; min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      display: flex; align-items: center; gap: 5px;
      transition: background .15s, color .15s;
      flex-shrink: 0;
    }
    .btn-copy:hover { background: var(--surface-2); color: var(--text); }
    .btn-copy.copied { color: var(--green); border-color: var(--green); }

    .debug-json-pre {
      margin-top: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 300px;
      overflow-y: auto;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      .header { padding: 0 16px; }
      .page-content { padding: 20px 16px; gap: 16px; }
      .status-banner { padding: 14px 16px; }
      .banner-label { font-size: 14px; }
    }
  </style>
</head>
<body>

<!-- ── App shell header ── -->
<header class="header">
  <div class="header-left">
    <a href="/" class="brand-mark" aria-label="Commander Home">
      <i class="ti ti-bolt" aria-hidden="true"></i>
    </a>
    <span class="header-wordmark">Commander</span>
  </div>
  <div class="header-right">
    <a href="/" class="btn-icon" data-tooltip="Home" aria-label="Home">
      <i class="ti ti-home"></i>
    </a>
    <button class="btn-icon" id="header-health-btn" title="Diagnostics"
            aria-label="Diagnostics" aria-current="page">
      <i class="ti ti-heartbeat" id="header-health-icon" style="transition:color .3s;"></i>
    </button>
    <button class="btn-icon" id="theme-btn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
      <i class="ti ti-moon" id="theme-icon"></i>
    </button>
  </div>
</header>

<!-- ── Page content ── -->
<main class="page-content">

  <h1 class="page-heading">System diagnostics</h1>

  <!-- Unreachable banner (shown when /api/health is unreachable) -->
  <div class="unreachable-banner hidden" id="unreachable-banner" role="alert">
    <i class="ti ti-wifi-off"></i>
    <span>Couldn't reach health endpoint — showing last known status</span>
  </div>

  <!-- Status banner -->
  <div class="status-banner banner-unknown" id="status-banner" role="status" aria-live="polite">
    <div class="banner-left">
      <span class="banner-icon" id="banner-icon">&#8203;</span>
      <div class="banner-text">
        <div class="banner-label label-unknown" id="banner-label">Loading…</div>
        <div class="banner-timestamp" id="banner-timestamp">Fetching health data…</div>
      </div>
    </div>
    <div class="banner-right">
      <button class="btn-refresh" id="refresh-btn" onclick="manualRefresh()">
        <i class="ti ti-refresh" id="refresh-btn-icon"></i>
        Refresh
      </button>
    </div>
  </div>

  <!-- Check cards grid -->
  <div class="cards-grid" id="cards-grid">
    <!-- Skeleton placeholders -->
    <div class="skel-card">
      <div class="skel skel-title"></div>
      <div class="skel skel-line"></div>
      <div class="skel skel-line2"></div>
    </div>
    <div class="skel-card">
      <div class="skel skel-title"></div>
      <div class="skel skel-line"></div>
      <div class="skel skel-line2"></div>
    </div>
    <div class="skel-card">
      <div class="skel skel-title"></div>
      <div class="skel skel-line"></div>
      <div class="skel skel-line2"></div>
    </div>
    <div class="skel-card">
      <div class="skel skel-title"></div>
      <div class="skel skel-line"></div>
      <div class="skel skel-line2"></div>
    </div>
    <div class="skel-card">
      <div class="skel skel-title"></div>
      <div class="skel skel-line"></div>
      <div class="skel skel-line2"></div>
    </div>
    <div class="skel-card">
      <div class="skel skel-title"></div>
      <div class="skel skel-line"></div>
      <div class="skel skel-line2"></div>
    </div>
  </div>

  <!-- Host doctor (issue #828) -->
  <section class="doctor-section" id="doctor-section" aria-labelledby="doctor-title">
    <div class="doctor-head">
      <div>
        <div class="doctor-title" id="doctor-title">Host doctor</div>
        <div class="doctor-sub">Pre-sprint host validation — same checks as <code>python scripts/doctor.py</code></div>
      </div>
      <button class="btn-refresh" id="doctor-btn" onclick="runDoctor()">
        <i class="ti ti-stethoscope" id="doctor-btn-icon"></i>
        Run doctor
      </button>
    </div>
    <div class="doctor-results" id="doctor-results" role="status" aria-live="polite"></div>
  </section>

  <!-- Debug section (collapsed by default) -->
  <div class="debug-section" id="debug-section">
    <button class="debug-toggle" id="debug-toggle" onclick="toggleDebug()"
            aria-expanded="false" aria-controls="debug-body">
      <span>Show debug info</span>
      <i class="ti ti-chevron-down debug-toggle-chevron"></i>
    </button>
    <div class="debug-body" id="debug-body" role="region">
      <!-- Raw JSON row -->
      <div class="debug-row">
        <span class="debug-label">Raw /api/health JSON</span>
        <button class="btn-copy" id="copy-json-btn" onclick="copyDebugJson()">
          <i class="ti ti-copy"></i>
          Copy
        </button>
      </div>
      <!-- Uptime row -->
      <div class="debug-row">
        <span class="debug-label">Dashboard uptime</span>
        <span class="debug-value" id="debug-uptime">—</span>
        <button class="btn-copy" id="copy-uptime-btn" onclick="copyText('debug-uptime', 'copy-uptime-btn')">
          <i class="ti ti-copy"></i>
          Copy
        </button>
      </div>
      <!-- Hostname + version row -->
      <div class="debug-row">
        <span class="debug-label">Mac hostname + version</span>
        <span class="debug-value" id="debug-host">—</span>
        <button class="btn-copy" id="copy-host-btn" onclick="copyText('debug-host', 'copy-host-btn')">
          <i class="ti ti-copy"></i>
          Copy
        </button>
      </div>
      <!-- Raw JSON viewer -->
      <pre class="debug-json-pre" id="debug-json-pre">No data yet.</pre>
    </div>
  </div>

</main>

<script>
  'use strict';

  // ── State ──────────────────────────────────────────────────────────────────
  let _lastHealthData = null;   // most recent successful /api/health response
  let _lastPolledAt   = null;   // Date when last poll completed
  let _refreshTimer   = null;   // setInterval handle for auto-refresh
  let _debounceTimer  = null;   // setTimeout handle for refresh debounce
  let _tsInterval     = null;   // setInterval handle for "N seconds ago" ticker

  // ── Theme ──────────────────────────────────────────────────────────────────
  (function initTheme() {
    const saved = localStorage.getItem('commander-theme');
    if (saved === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      const icon = document.getElementById('theme-icon');
      if (icon) icon.className = 'ti ti-sun';
    }
  })();

  function toggleTheme() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const next   = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('commander-theme', next);
    const icon = document.getElementById('theme-icon');
    if (icon) icon.className = isDark ? 'ti ti-moon' : 'ti ti-sun';
  }

  // ── Check name display mapping ─────────────────────────────────────────────
  const CHECK_DISPLAY_NAMES = {
    dashboard:        'Dashboard',
    database:         'Database',
    github_auth:      'GitHub auth',
    claude_code_auth: 'Claude Code auth',
    disk:             'Disk space',
    stuck_sprints:    'Sprint health',
  };

  // ── Recovery hints (hardcoded per check_name) ──────────────────────────────
  function getRecoveryHint(checkName, checkData) {
    const status = checkData.status || 'ok';
    if (status === 'ok') return null;

    switch (checkName) {
      case 'github_auth':
        return { text: 'Run `gh auth login` on the Mac mini', style: 'red' };

      case 'disk': {
        const pct = checkData.used_pct != null ? checkData.used_pct : null;
        const hint = 'Free up space: `du -sh ~/Library/Logs/` to find large logs';
        return { text: hint, style: 'amber' };
      }

      case 'stuck_sprints': {
        const stuck = checkData.stuck || [];
        if (stuck.length > 0) {
          const lines = stuck.map(s => {
            const hours = s.hours != null ? s.hours.toFixed(1) : '?';
            return `Sprint ${s.sprint} has been running with no log activity for ${hours} hours — consider cancelling`;
          });
          return { text: lines.join('\n'), style: 'amber' };
        }
        return { text: 'A sprint may be stuck — check sprint management', style: 'amber' };
      }

      case 'claude_code_auth':
        return { text: 'Claude Code auth check failed — verify Claude Code is installed and authenticated', style: 'red' };

      case 'database':
        return { text: 'Database error — check dashboard.db permissions or restart the dashboard', style: 'red' };

      case 'dashboard':
        return { text: 'Dashboard self-check failed — try restarting the dashboard server', style: 'red' };

      default:
        return null;
    }
  }

  // ── Status indicator for a check ──────────────────────────────────────────
  function getStatusIndicator(status) {
    switch (status) {
      case 'ok':      return { symbol: '✓', color: 'var(--green)' };
      case 'warn':    return { symbol: '⚠', color: 'var(--amber)' };
      case 'degraded':return { symbol: '⚠', color: 'var(--amber)' };
      case 'expired': return { symbol: '✕', color: 'var(--red)' };
      case 'missing': return { symbol: '✕', color: 'var(--red)' };
      case 'down':    return { symbol: '✕', color: 'var(--red)' };
      case 'timeout': return { symbol: '✕', color: 'var(--red)' };
      case 'critical':return { symbol: '✕', color: 'var(--red)' };
      default:        return { symbol: '?', color: 'var(--text-sub)' };
    }
  }

  // ── Build detail lines from check data ────────────────────────────────────
  function buildDetailLines(checkName, checkData) {
    const lines = [];
    const status = checkData.status || 'unknown';

    if (checkData.error) {
      lines.push('Error: ' + checkData.error);
    }

    switch (checkName) {
      case 'dashboard':
        if (checkData.uptime_seconds != null) {
          const secs = Math.round(checkData.uptime_seconds);
          const h = Math.floor(secs / 3600);
          const m = Math.floor((secs % 3600) / 60);
          const s = secs % 60;
          lines.push('Uptime: ' + (h ? h + 'h ' : '') + (m ? m + 'm ' : '') + s + 's');
        }
        if (checkData.version) lines.push('Version: ' + checkData.version);
        if (checkData.host)    lines.push('Host: ' + checkData.host);
        break;

      case 'database':
        if (checkData.path)  lines.push('Path: ' + checkData.path);
        if (checkData.size_bytes != null) {
          const kb = (checkData.size_bytes / 1024).toFixed(1);
          lines.push('Size: ' + kb + ' KB');
        }
        if (status === 'ok') lines.push('Connection: OK');
        break;

      case 'github_auth':
        if (checkData.user)   lines.push('Authenticated as @' + checkData.user);
        if (status === 'expired') lines.push('Token has expired');
        if (status === 'missing') lines.push('No token found');
        break;

      case 'claude_code_auth':
        if (checkData.version)  lines.push('Claude Code: ' + checkData.version);
        if (status === 'ok')    lines.push('Authentication: valid');
        if (status === 'missing') lines.push('Claude Code not found');
        if (status === 'expired') lines.push('Session expired');
        break;

      case 'disk': {
        if (checkData.free_gb != null && checkData.total_gb != null) {
          const free  = checkData.free_gb.toFixed(1);
          const total = checkData.total_gb.toFixed(1);
          lines.push(free + ' GB free of ' + total + ' GB');
        }
        if (checkData.used_pct != null) {
          lines.push('Used: ' + Math.round(checkData.used_pct) + '%');
        }
        break;
      }

      case 'stuck_sprints': {
        const stuck = checkData.stuck || [];
        if (stuck.length === 0) {
          lines.push('No stuck sprints detected');
        } else {
          lines.push(stuck.length + ' sprint(s) appear stuck');
        }
        break;
      }
    }

    if (lines.length === 0) {
      lines.push('Status: ' + status);
    }

    return lines;
  }

  // ── Render cards ──────────────────────────────────────────────────────────
  function renderCards(data) {
    const grid  = document.getElementById('cards-grid');
    const checks = data.checks || {};

    // canonical order matching /api/health
    const ORDER = ['dashboard', 'database', 'github_auth', 'claude_code_auth', 'disk', 'stuck_sprints'];

    grid.innerHTML = '';

    ORDER.forEach(checkName => {
      const checkData = checks[checkName] || { status: 'unknown' };
      const status    = checkData.status || 'unknown';
      const indicator = getStatusIndicator(status);
      const details   = buildDetailLines(checkName, checkData);
      const hint      = getRecoveryHint(checkName, checkData);
      const dispName  = CHECK_DISPLAY_NAMES[checkName] || checkName;

      const card = document.createElement('div');
      card.className = 'check-card';
      card.setAttribute('data-check', checkName);

      // Card top: name + indicator
      const cardTop = document.createElement('div');
      cardTop.className = 'check-card-top';

      const nameEl = document.createElement('div');
      nameEl.className = 'check-name';
      nameEl.textContent = dispName;

      const indicatorEl = document.createElement('div');
      indicatorEl.className = 'check-status-indicator';
      indicatorEl.style.color = indicator.color;
      indicatorEl.textContent = indicator.symbol;

      cardTop.appendChild(nameEl);
      cardTop.appendChild(indicatorEl);
      card.appendChild(cardTop);

      // Detail lines
      if (details.length > 0) {
        const detailsEl = document.createElement('div');
        detailsEl.className = 'check-details';
        details.forEach(line => {
          const lineEl = document.createElement('div');
          lineEl.className = 'check-detail-line';
          lineEl.textContent = line;
          detailsEl.appendChild(lineEl);
        });
        card.appendChild(detailsEl);
      }

      // Recovery hint
      if (hint) {
        const hintEl = document.createElement('div');
        hintEl.className = 'check-hint' + (hint.style === 'amber' ? ' hint-amber' : '');
        hintEl.textContent = hint.text;
        card.appendChild(hintEl);
      }

      grid.appendChild(card);
    });
  }

  // ── Banner ────────────────────────────────────────────────────────────────
  function renderBanner(status) {
    const banner    = document.getElementById('status-banner');
    const bannerIcon = document.getElementById('banner-icon');
    const label     = document.getElementById('banner-label');

    // Remove all banner color classes
    banner.classList.remove('banner-ok', 'banner-degraded', 'banner-down', 'banner-unknown');
    label.classList.remove('label-ok', 'label-degraded', 'label-down', 'label-unknown');

    switch (status) {
      case 'ok':
        banner.classList.add('banner-ok');
        label.classList.add('label-ok');
        bannerIcon.textContent = '✓';
        label.textContent = 'All systems operational';
        break;
      case 'degraded':
        banner.classList.add('banner-degraded');
        label.classList.add('label-degraded');
        bannerIcon.textContent = '⚠';
        label.textContent = 'Degraded — some checks warning';
        break;
      case 'down':
        banner.classList.add('banner-down');
        label.classList.add('label-down');
        bannerIcon.textContent = '✕';
        label.textContent = 'System down — immediate attention needed';
        break;
      default:
        banner.classList.add('banner-unknown');
        label.classList.add('label-unknown');
        bannerIcon.textContent = '?';
        label.textContent = 'Status unknown';
    }
  }

  // ── Timestamp ticker ──────────────────────────────────────────────────────
  function startTimestampTicker() {
    if (_tsInterval) clearInterval(_tsInterval);
    _tsInterval = setInterval(updateTimestamp, 1000);
  }

  function updateTimestamp() {
    if (!_lastPolledAt) return;
    const el   = document.getElementById('banner-timestamp');
    const secs = Math.round((Date.now() - _lastPolledAt.getTime()) / 1000);
    el.textContent = 'Updated ' + secs + ' second' + (secs === 1 ? '' : 's') + ' ago';
  }

  // ── Header health icon ────────────────────────────────────────────────────
  function applyHeaderHealthIcon(status) {
    const icon = document.getElementById('header-health-icon');
    if (!icon) return;
    icon.classList.remove('health-down');
    if (status === 'ok') {
      icon.style.color = 'var(--green)';
    } else if (status === 'degraded') {
      icon.style.color = 'var(--amber)';
    } else {
      icon.style.color = 'var(--red)';
      icon.classList.add('health-down');
    }
  }

  // ── Debug section helpers ─────────────────────────────────────────────────
  function updateDebugSection(data) {
    // Raw JSON
    const pre = document.getElementById('debug-json-pre');
    if (pre) pre.textContent = JSON.stringify(data, null, 2);

    // Uptime from dashboard check
    const uptimeEl = document.getElementById('debug-uptime');
    if (uptimeEl) {
      const dash = (data.checks || {}).dashboard || {};
      if (dash.uptime_seconds != null) {
        const secs = Math.round(dash.uptime_seconds);
        const h = Math.floor(secs / 3600);
        const m = Math.floor((secs % 3600) / 60);
        const s = secs % 60;
        uptimeEl.textContent = (h ? h + 'h ' : '') + (m ? m + 'm ' : '') + s + 's';
      } else {
        uptimeEl.textContent = '—';
      }
    }

    // Host + version from dashboard check
    const hostEl = document.getElementById('debug-host');
    if (hostEl) {
      const dash = (data.checks || {}).dashboard || {};
      const parts = [];
      if (dash.host)    parts.push(dash.host);
      if (dash.version) parts.push('v' + dash.version);
      hostEl.textContent = parts.length ? parts.join(' / ') : '—';
    }
  }

  // ── Fetch health data ─────────────────────────────────────────────────────
  async function fetchHealth() {
    const unreachableBanner = document.getElementById('unreachable-banner');
    try {
      const resp = await fetch('/api/health');
      // Accept 200 and 503 (down status)
      if (!resp.ok && resp.status !== 503) {
        throw new Error('HTTP ' + resp.status);
      }
      const data = await resp.json();
      _lastHealthData = data;
      _lastPolledAt   = new Date();

      // Hide unreachable banner
      unreachableBanner.classList.add('hidden');

      renderBanner(data.status);
      renderCards(data);
      applyHeaderHealthIcon(data.status);
      updateDebugSection(data);
      updateTimestamp();
    } catch (err) {
      console.warn('Health fetch failed:', err);
      // Show unreachable banner
      unreachableBanner.classList.remove('hidden');

      // If we have last known data, keep cards visible
      if (_lastHealthData) {
        renderBanner(_lastHealthData.status);
        renderCards(_lastHealthData);
        applyHeaderHealthIcon(_lastHealthData.status);
      } else {
        // No prior data — show unknown banner, clear skeleton
        renderBanner('unknown');
        const grid = document.getElementById('cards-grid');
        grid.innerHTML = '<div style="grid-column:1/-1;padding:24px;text-align:center;color:var(--text-muted);font-size:13px">Unable to load health data — is the dashboard running?</div>';
      }
    }
  }

  // ── Manual refresh (debounced 1s) ─────────────────────────────────────────
  function manualRefresh() {
    const btn = document.getElementById('refresh-btn');
    if (_debounceTimer) return; // already debounced

    btn.disabled = true;
    fetchHealth().finally(() => {
      _debounceTimer = setTimeout(() => {
        _debounceTimer = null;
        if (btn) btn.disabled = false;
      }, 1000);
    });
  }

  // ── Host doctor (issue #828) ──────────────────────────────────────────────
  function _doctorRow(check) {
    const row = document.createElement('div');
    row.className = 'doctor-row ' + (check.ok ? 'is-pass' : 'is-fail');

    const top = document.createElement('div');
    top.className = 'doctor-row-top';
    const badge = document.createElement('span');
    badge.className = 'doctor-badge';
    badge.textContent = check.ok ? '[PASS]' : '[FAIL]';
    const name = document.createElement('span');
    name.className = 'doctor-name';
    name.textContent = check.name;
    top.appendChild(badge);
    top.appendChild(name);
    row.appendChild(top);

    if (check.detail) {
      const detail = document.createElement('div');
      detail.className = 'doctor-detail';
      detail.textContent = check.detail;
      row.appendChild(detail);
    }
    if (!check.ok && check.fix) {
      const fix = document.createElement('div');
      fix.className = 'doctor-fix';
      const lbl = document.createElement('strong');
      lbl.textContent = 'fix: ';
      fix.appendChild(lbl);
      fix.appendChild(document.createTextNode(check.fix));
      row.appendChild(fix);
    }
    return row;
  }

  async function runDoctor() {
    const btn     = document.getElementById('doctor-btn');
    const results = document.getElementById('doctor-results');
    btn.disabled = true;
    results.replaceChildren();
    const loading = document.createElement('div');
    loading.className = 'doctor-detail';
    loading.textContent = 'Running host checks…';
    results.appendChild(loading);
    try {
      const resp = await fetch('/api/doctor');
      const data = await resp.json();
      results.replaceChildren();
      (data.checks || []).forEach((c) => results.appendChild(_doctorRow(c)));
    } catch (err) {
      console.warn('Doctor fetch failed:', err);
      results.replaceChildren();
      const fail = document.createElement('div');
      fail.className = 'doctor-detail';
      fail.textContent = 'Unable to run doctor — is the dashboard running?';
      results.appendChild(fail);
    } finally {
      btn.disabled = false;
    }
  }

  // ── Auto-refresh ──────────────────────────────────────────────────────────
  function startAutoRefresh() {
    if (_refreshTimer) clearInterval(_refreshTimer);
    _refreshTimer = setInterval(fetchHealth, 30000);
  }

  // ── Debug toggle ──────────────────────────────────────────────────────────
  function toggleDebug() {
    const toggle = document.getElementById('debug-toggle');
    const body   = document.getElementById('debug-body');
    const isOpen = body.classList.contains('open');
    body.classList.toggle('open', !isOpen);
    toggle.classList.toggle('expanded', !isOpen);
    toggle.setAttribute('aria-expanded', String(!isOpen));
    // Update label text
    toggle.querySelector('span').textContent = isOpen ? 'Show debug info' : 'Hide debug info';
  }

  // ── Copy helpers ──────────────────────────────────────────────────────────
  async function copyDebugJson() {
    const btn = document.getElementById('copy-json-btn');
    const text = _lastHealthData ? JSON.stringify(_lastHealthData, null, 2) : 'No data';
    await copyToClipboard(text, btn);
  }

  async function copyText(valueElId, btnId) {
    const el  = document.getElementById(valueElId);
    const btn = document.getElementById(btnId);
    const text = el ? el.textContent : '';
    await copyToClipboard(text, btn);
  }

  async function copyToClipboard(text, btn) {
    try {
      await navigator.clipboard.writeText(text);
      if (btn) {
        const originalHTML = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = '<i class="ti ti-check"></i> Copied';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = originalHTML;
        }, 2000);
      }
    } catch (e) {
      console.warn('Clipboard write failed:', e);
    }
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    fetchHealth();
    startAutoRefresh();
    startTimestampTicker();
  });
</script>
