<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Brief — Commander</title>
  <!-- Apply saved theme before paint to avoid a flash. Defaults to dark. -->
  <script>
    try {
      document.documentElement.setAttribute(
        'data-theme', localStorage.getItem('theme') || 'dark');
    } catch (_) { document.documentElement.setAttribute('data-theme', 'dark'); }
    // Pre-set date picker max to today so it's usable before JS init completes
    document.addEventListener('DOMContentLoaded', function(){
      var p = document.getElementById('date-pick');
      if (p) {
        var t = new Date();
        var iso = t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
        p.max = iso;
        p.value = iso;
      }
    });
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <style>
    /* ── local token ── */
    :root {
      --icon-on-color: #fff;
      --nav-h: 52px;
    }

    /* ── reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── focus ring (WCAG 2.1 AA) ── */
    :focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }

    /* ── base ── */
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── top nav ── */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: var(--z-nav);
      height: var(--nav-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
    }
    .top-nav-brand {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      flex-shrink: 0;
    }
    .top-nav-sep {
      width: 1px;
      height: 18px;
      background: var(--border);
      flex-shrink: 0;
    }
    .top-nav-page {
      font-size: 13px;
      color: var(--text-muted);
      flex: 1;
    }
    .top-nav-date-nav {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .nav-btn {
      font-family: var(--mono);
      font-size: 12px;
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .nav-btn:hover { background: var(--surface-hover); color: var(--text); border-color: var(--text-muted); }
    .nav-btn.today {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }
    .nav-btn.today:hover { opacity: 0.85; }
    .nav-btn.today:disabled { opacity: 0.45; cursor: default; }
    .date-pick-wrap { position: relative; display: inline-flex; }
    .date-pick-wrap input[type=date] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* ── page layout ── */
    .page-body {
      max-width: 1040px;
      margin: 0 auto;
      padding: 24px 24px 48px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ── brief header ── */
    .brief-head {
      padding: 24px 0 20px;
      display: flex;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brief-l { flex: 1; min-width: 180px; }
    .brief-date {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.1;
      text-wrap: balance;
    }
    .brief-cover {
      font-size: 12px;
      color: var(--text-muted);
      font-family: var(--mono);
      margin-top: 4px;
    }

    /* ── status bar (replaces KPI hero strip) ── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .stat-cell {
      flex: 1;
      padding: 12px 16px;
      display: flex;
      align-items: baseline;
      gap: 7px;
      border-right: 1px solid var(--border);
    }
    .stat-cell:last-child { border-right: none; }
    .stat-v {
      font-size: 20px;
      font-weight: 700;
      font-family: var(--mono);
      line-height: 1;
    }
    .stat-v.g { color: var(--green); }
    .stat-v.a { color: var(--amber); }
    .stat-l {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ── section headers — no all-caps eyebrows ── */
    .sec-hdr {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }
    .sec-hdr .ti { color: var(--text-muted); font-size: 15px; }
    .sec-hdr .count {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 400;
      margin-left: 2px;
    }

    /* ── section wrapper ── */
    .sec { margin-bottom: 20px; }

    /* ── planner list (ran overnight / waiting on you) ── */
    .planner-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden;
    }
    .planner-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 15px;
      border-top: 1px solid var(--border);
    }
    .planner-row:first-child { border-top: none; }
    .planner-row .label {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .planner-meta { font-size: 12px; color: var(--text-muted); }
    .planner-meta .mono { font-family: var(--mono); }
    .planner-spacer { margin-left: auto; }

    .outcome-badge {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .outcome-badge.success { background: var(--green-bg); color: var(--green); }
    .outcome-badge.failure { background: var(--red-bg); color: var(--red); }
    .outcome-badge.partial { background: var(--amber-bg); color: var(--amber); }

    .planner-link {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 4px 10px;
      cursor: pointer;
      white-space: nowrap;
      background: transparent;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .planner-link:hover { background: var(--surface-hover); color: var(--text); border-color: var(--text-muted); }

    .planner-see-more {
      margin-top: 4px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 2px;
      transition: color 0.12s;
    }
    .planner-see-more:hover { color: var(--text); }
    .planner-see-more .ti { font-size: 13px; }

    /* ── decisions ── */
    .decisions {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden;
    }
    .dec-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 15px;
      border-top: 1px solid var(--border);
    }
    .dec-row:first-child { border-top: none; }
    .dec-ic {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
      background: var(--amber-bg);
      color: var(--amber);
    }
    .dec-ic.go { background: var(--green-bg); color: var(--green); }
    .dec-ic.red { background: var(--red-bg); color: var(--red); }
    .dec-txt { flex: 1; font-size: 13px; line-height: 1.45; }
    .dec-txt .mono { font-family: var(--mono); font-size: 12px; color: var(--text-muted); }
    .dec-act {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 4px 10px;
      cursor: pointer;
      white-space: nowrap;
      background: transparent;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .dec-act:hover { background: var(--surface-hover); color: var(--text); border-color: var(--text-muted); }
    .dec-act.primary {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }
    .dec-act.primary:hover { opacity: 0.85; }
    .dec-act[disabled] { opacity: 0.5; cursor: default; pointer-events: none; }
    .dec-empty {
      padding: 14px 15px;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* ── project brief cards ── */
    .pbrief {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-2xl);
      overflow: hidden;
      margin-bottom: 12px;
      transition: border-color 0.15s;
    }
    .pbrief:hover { border-color: var(--text-sub); }
    .pbrief-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
    }
    .pbic {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      color: var(--icon-on-color);
    }
    .pb-title-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: inherit;
      min-width: 0;
    }
    .pb-title-link:hover .pbname { color: var(--blue); }
    .pbname {
      font-weight: 600;
      font-size: 15px;
      transition: color 0.12s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pbname-go {
      width: 22px;
      height: 22px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--text-sub);
      background: transparent;
      flex-shrink: 0;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
    }
    .pb-title-link:hover .pbname-go { color: var(--blue); border-color: var(--blue); background: var(--blue-bg); }

    /* card meta (progress + timestamp) */
    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-sub);
    }
    .card-meta-item { display: inline-flex; align-items: center; gap: 3px; }

    /* status pill */
    .pbstatus {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .pbstatus.run { background: var(--green-bg); color: var(--green); }
    .pbstatus.idle { background: var(--surface-2); color: var(--text-muted); }
    .pbstatus.blocked { background: var(--red-bg); color: var(--red); }
    .pbstatus.run .d {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 0 2px var(--green-bg); }
      50% { box-shadow: 0 0 0 5px var(--green-bg); }
    }

    /* milestone indicator */
    .pb-milestone {
      display: none;
      margin-left: auto;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      padding: 3px 9px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      max-width: 44%;
      transition: border-color 0.12s, color 0.12s;
    }
    /* Milestones hidden per operator request — remove .show override to restore */
    .pb-milestone.show { display: none; }
    .pb-milestone .ti { font-size: 12px; flex-shrink: 0; }
    .pb-ms-name { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pb-milestone:hover { border-color: var(--blue); color: var(--blue); }
    .pb-milestone:hover .pb-ms-name { color: var(--blue); }
    .pb-ms-count { font-family: var(--mono); font-size: 11px; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }
    .pb-milestone + .pbstatus { margin-left: 8px; }

    /* collapse toggle */
    .pb-bottom-toggle {
      width: 24px;
      height: 24px;
      min-width: var(--space-12);
      min-height: var(--space-12);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: color 0.12s, border-color 0.12s;
    }
    .pb-bottom-toggle:hover { color: var(--text); border-color: var(--text-muted); }
    .pb-bottom-toggle .ti { transition: transform 0.15s; }
    .pbrief.hide-bottom .pb-bottom-toggle .ti { transform: rotate(-90deg); }

    /* 2×2 grid */
    .pb-grid {
      display: grid;
      grid-template-columns: 3fr 2fr;
      grid-template-rows: auto auto;
      align-items: stretch;
    }
    @media (max-width: 740px) {
      .pb-grid { grid-template-columns: 1fr; grid-template-rows: auto; }
    }
    .pb-cell {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 14px 16px;
    }
    .pb-cell-summary { grid-column: 1; grid-row: 1; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .pb-cell-activity { grid-column: 2; grid-row: 1; border-bottom: 1px solid var(--border); }
    .pb-cell-shipped { grid-column: 1; grid-row: 2; border-right: 1px solid var(--border); }
    .pb-cell-todo { grid-column: 2; grid-row: 2; }
    .pbrief.hide-bottom .pb-cell-shipped,
    .pbrief.hide-bottom .pb-cell-todo { display: none; }
    @media (max-width: 740px) {
      .pb-cell-summary, .pb-cell-shipped { border-right: none; }
      .pb-cell-summary, .pb-cell-todo, .pb-cell-shipped { border-bottom: 1px solid var(--border); }
    }
    .pb-cell-todo .todo { padding: 0; min-height: 0; flex: 1; }
    .pb-cell-todo .todo.compact { max-height: none; }

    /* summary cell */
    .pb-summary { padding: 0 0 10px; display: flex; gap: 10px; align-items: flex-start; }
    .pb-sum-ic {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-lg);
      background: var(--blue-bg);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .pb-sum-body { flex: 1; }
    .pb-sum-tag {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 1px 6px;
      border-radius: var(--radius-full);
      background: var(--purple-bg);
      color: var(--purple);
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin-bottom: 5px;
    }
    .pb-sum-text { font-size: 13px; line-height: 1.6; color: var(--text); }
    .pb-sum-text strong { font-weight: 600; }
    .pb-sum-loading {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--text-muted);
      font-size: 13px;
    }
    .pb-sum-loading .ti { animation: spin 1s linear infinite; }

    /* loading state */
    .loading-state {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: var(--space-10) var(--space-4);
      color: var(--text-muted);
      font-size: 14px;
    }
    .loading-state .ti { font-size: 18px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* project icon color classes */
    .pbic--gray { background: var(--text-sub); }
    .pbic--blue { background: var(--blue); }
    .pbic--green { background: var(--green); }
    .pbic--purple { background: var(--purple); }
    .pbic--red { background: var(--red); }
    .pbic--orange, .pbic--amber, .pbic--yellow { background: var(--amber); }
    .pbic--pink { background: var(--pink); }
    .pbic--cyan, .pbic--teal { background: var(--teal); }
    .pbic--indigo { background: var(--indigo); }

    /* status line */
    .pb-statusline {
      margin: 0;
      padding: 9px 12px;
      background: var(--surface-2);
      border-radius: var(--radius-lg);
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .pb-statusline .mono { font-family: var(--mono); font-size: 12px; color: var(--text); }
    .pb-statusline.run { background: var(--green-bg); color: var(--text); }
    .pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse-dot 2s ease-in-out infinite;
      flex-shrink: 0;
    }
    .agent-tag {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: var(--radius-xs);
      background: var(--purple-bg);
      color: var(--purple);
    }
    .pb-pct {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--green);
    }

    /* drill section label */
    .drill-sec {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
      margin: 0 0 8px;
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .pb-cell-shipped .relbox, .pb-cell-activity .timeline { flex: 1; min-height: 0; }

    /* relbox (shipped detail) */
    .relbox {
      background: var(--surface-2);
      border-radius: var(--radius-lg);
      padding: 10px 12px;
    }
    .rel-name {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .rel-name .cnt { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--text-sub); font-weight: 400; }
    .feat { display: flex; gap: 7px; font-size: 13px; padding: 2px 0; }
    .feat .plus { color: var(--green); font-weight: 700; font-family: var(--mono); }
    .muted { color: var(--text-sub); font-size: 13px; }

    /* timeline (recent activity) */
    .timeline { background: var(--surface-2); border-radius: var(--radius-lg); overflow: hidden; }
    .tl-row {
      display: flex;
      gap: 8px;
      align-items: baseline;
      padding: 6px 11px;
      border-top: 1px solid var(--border);
      font-size: 12px;
    }
    .tl-row:first-child { border-top: none; }
    .tl-time { font-family: var(--mono); font-size: 10px; color: var(--text-sub); min-width: 36px; }
    .tl-badge {
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: var(--radius-xs);
      flex-shrink: 0;
      background: var(--green-bg);
      color: var(--green);
    }
    .tl-badge.github { background: var(--purple-bg); color: var(--purple); }
    .tl-txt { flex: 1; color: var(--text-muted); }
    .tl-txt .mono { font-size: 11px; }
    .tl-more { padding: 5px 11px; font-size: 11px; color: var(--text-sub); border-top: 1px solid var(--border); }
    .tl-foot { padding: 5px 11px; border-top: 1px solid var(--border); font-size: 11px; }
    .tl-foot a { color: var(--text-sub); text-decoration: none; font-family: var(--mono); transition: color 0.12s; }
    .tl-foot a:hover { color: var(--text); }

    /* project card footer */
    .pb-foot {
      display: flex;
      justify-content: flex-end;
      padding: 10px 16px 12px;
      border-top: 1px solid var(--border);
    }
    .open-proj {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--bg);
      border: 1px solid var(--text);
      background: var(--text);
      border-radius: var(--radius-md);
      padding: 6px 13px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.12s;
    }
    .open-proj:hover { opacity: 0.82; }

    /* add project */
    .add-proj {
      border: 1px dashed var(--border);
      border-radius: var(--radius-2xl);
      padding: 14px;
      text-align: center;
      color: var(--text-sub);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      text-decoration: none;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
    }
    .add-proj:hover { color: var(--text); border-color: var(--text-muted); background: var(--surface); }

    .empty-note {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 16px;
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
    }

    /* ── reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .pbstatus.run .d,
      .pulse,
      .pb-sum-loading .ti,
      .loading-state .ti { animation: none; }
      .pbrief,
      .nav-btn,
      .dec-act,
      .open-proj,
      .add-proj,
      .pb-milestone,
      .pbname-go,
      .pb-bottom-toggle,
      .planner-link,
      .tl-foot a { transition: none; }
    }

    /* ── responsive ── */
    @media (max-width: 560px) {
      .page-body { padding: 16px 12px 40px; }
      .status-bar { flex-wrap: wrap; }
      .stat-cell { flex: 1 1 50%; min-width: 110px; }
      .top-nav-date-nav { gap: 3px; }
      .brief-date { font-size: 22px; }
      /* hide the breadcrumb label so nav fits on small screens */
      .top-nav-sep,
      .top-nav-page { display: none; }
    }
  </style>
</head>
<body>
  <nav class="top-nav" aria-label="Commander">
    <span class="top-nav-brand">Commander</span>
    <span class="top-nav-sep" aria-hidden="true" role="presentation"></span>
    <span class="top-nav-page" id="top-nav-brief-label">Daily Brief</span>
    <div class="top-nav-date-nav">
      <button class="nav-btn" onclick="gotoPrevDay()" aria-label="Previous day"><i class="ti ti-chevron-left" style="font-size:13px"></i></button>
      <button class="nav-btn today" onclick="gotoToday()" id="today-btn">Today</button>
      <span class="date-pick-wrap">
        <button class="nav-btn" type="button" aria-hidden="true" tabindex="-1"><i class="ti ti-calendar" style="font-size:12px"></i></button>
        <input type="date" id="date-pick" aria-label="Pick a date" max="" onchange="onDatePick(event)">
      </span>
    </div>
  </nav>

  <div class="page-body">
    <div id="home">
      <div class="loading-state" id="boot-note"><i class="ti ti-loader-2"></i> Loading daily brief…</div>
    </div>
  </div>

  <script src="/static/add-project-modal.js"></script>
  <script src="/static/project-todo.js"></script>
  <script>
  // ── issue #842: client-side assembly of the CEO daily brief ──────────────
  const MONTHS = ['January','February','March','April','May','June','July',
                  'August','September','October','November','December'];
  const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  let _repoBySlug = {};
  let _projBySlug = {};
  let _curDate = null;

  const PBIC_PALETTE = new Set(['gray','blue','green','purple','red','orange','amber','yellow','pink','cyan','teal','indigo']);
  function _projectBadgeHtml(slug){
    const proj = _projBySlug[slug] || {};
    const raw = (proj.color || proj.icon_color || 'gray').toLowerCase().replace(/[^a-z]/g, '');
    const color = PBIC_PALETTE.has(raw) ? raw : 'gray';
    const icon = proj.icon || 'ti-folder';
    return `<span class="pbic pbic--${esc(color)}" aria-hidden="true"><i class="ti ${esc(icon)}"></i></span>`;
  }

  function _projectDisplayName(slug){
    const proj = _projBySlug[slug] || {};
    return proj.name || slug;
  }

  function _sprintMgmtHref(slug){
    return '/project/' + encodeURIComponent(slug) + '/sprint-mgmt';
  }

  function _bottomHidden(slug){
    try { return localStorage.getItem('pb_hide_bottom_' + slug) === '1'; }
    catch(_){ return false; }
  }
  function toggleBottom(slug){
    const card = document.querySelector('.pbrief[data-slug="' + (window.CSS && CSS.escape ? CSS.escape(slug) : slug) + '"]');
    if (!card) return;
    const hidden = card.classList.toggle('hide-bottom');
    try { localStorage.setItem('pb_hide_bottom_' + slug, hidden ? '1' : '0'); } catch(_){}
  }

  function _projectTitleLinkHtml(slug){
    const name = _projectDisplayName(slug);
    return `<a class="pb-title-link" href="${esc(_sprintMgmtHref(slug))}" title="Open sprint management">` +
      _projectBadgeHtml(slug) +
      `<span class="pbname">${esc(name)}</span>` +
      `<span class="pbname-go" aria-hidden="true"><i class="ti ti-arrow-right"></i></span>` +
      `</a>`;
  }

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function parseDate(s){
    const [y,m,d] = String(s).split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function fmtIso(dt){
    return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') +
           '-' + String(dt.getDate()).padStart(2,'0');
  }
  function todayIso(){ return fmtIso(new Date()); }

  // ── boot ──────────────────────────────────────────────────────────────────
  function _deckRedirect(){
    const p = new URLSearchParams(window.location.search);
    const project = p.get('project');
    if (!project) return false;
    const view = (p.get('view') || '').toLowerCase();
    const tab = (view === 'activity') ? 'logs'
              : (view === 'tickets')  ? 'tickets'
              : 'sprint';
    const q = new URLSearchParams();
    if (view) q.set('view', view);
    const filter = p.get('filter');
    if (filter) q.set('filter', filter);
    const qs = q.toString();
    window.location.replace(
      '/project/' + encodeURIComponent(project) + '/' + tab + (qs ? '?' + qs : '')
    );
    return true;
  }

  async function init(){
    if (_deckRedirect()) return;
    try {
      const home = await (await fetch('/api/home')).json();
      (home.projects || []).forEach(p => {
        if (!p.slug) return;
        if (p.repo) _repoBySlug[p.slug] = p.repo;
        _projBySlug[p.slug] = {
          name: p.name || p.slug,
          icon: p.icon || 'ti-folder',
          color: p.color || p.icon_color || 'gray',
        };
      });
    } catch(_) {}

    const url = new URL(window.location.href);
    const d = url.searchParams.get('date');
    await loadBrief(d);
  }

  function summaryLoadingHtml(){
    return '<span class="pb-sum-loading"><i class="ti ti-loader-2" style="font-size:13px"></i> Loading summary…</span>';
  }

  async function loadBrief(date){
    _curDate = date;
    const root = document.getElementById('home');
    const isBoot = root.querySelector('#boot-note') && root.children.length === 1;
    if (isBoot) {
      root.innerHTML = renderSkeleton(date);
    }

    let artifact;
    try {
      const q = date ? ('?date=' + encodeURIComponent(date)) : '';
      artifact = await (await fetch('/api/brief/daily' + q)).json();
    } catch(_) {
      root.innerHTML = '<div class="empty-note">Could not load the daily brief.</div>';
      return;
    }
    date = date || (artifact && artifact.date) || todayIso();
    _curDate = date;

    // sync date nav controls
    const pick = document.getElementById('date-pick');
    if (pick) { pick.value = date; pick.max = todayIso(); }
    const todayBtn = document.getElementById('today-btn');
    if (todayBtn) todayBtn.disabled = (date === todayIso());
    // update nav breadcrumb
    const navLabel = document.getElementById('top-nav-brief-label');
    if (navLabel) {
      const dt = parseDate(date);
      navLabel.textContent = DOW[dt.getDay()] + ', ' + MONTHS[dt.getMonth()] + ' ' + dt.getDate();
    }

    const brief = (artifact && artifact.brief) || {};
    const gk = brief.global_kpis || {};
    const decisions = brief.decisions || [];
    const projects = brief.projects || [];

    let html = '';
    html += renderHeader(date, artifact, projects.length);
    html += renderKpis(gk);
    html += renderRanOvernight(brief.ran_overnight || []);
    html += renderWaitingOnYou(brief.waiting_on_you || []);
    html += renderDecisions(decisions, projects);
    html += renderProjectsShell(projects, artifact.available);
    html += renderSuggestedNext(brief.suggested_next || []);
    root.innerHTML = html;

    projects.forEach(p => loadProjectSummary(p.project, date));
    projects.forEach(p => {
      const slug = p.project;
      const el = document.getElementById('todo-' + slug);
      if (el && window.CommanderTodo) CommanderTodo.mount(el, slug);
    });
    projects.forEach(p => loadMilestone(p.project, p.repo));
  }

  async function loadMilestone(slug, repo){
    const el = document.getElementById('ms-' + slug);
    if (!el || !repo) return;
    try {
      const r = await fetch('/api/home/milestone?repo=' + encodeURIComponent(repo));
      if (!r.ok) return;
      const m = await r.json();
      if (!m || !m.label) return;
      const name = m.title || 'Milestone';
      el.querySelector('.pb-ms-name').textContent = name;
      el.querySelector('.pb-ms-count').textContent = m.label;
      el.setAttribute('aria-label', name + ': ' + m.label + ', open Roadmap tab');
      el.classList.add('show');
    } catch(_) {}
  }

  // ── brief header ──────────────────────────────────────────────────────────
  function renderHeader(date, artifact, projCount){
    const dt = parseDate(date);
    const dateStr = DOW[dt.getDay()] + ', ' + MONTHS[dt.getMonth()] + ' ' + dt.getDate();
    let cover = '';
    if (artifact && artifact.covering_since){
      cover = 'covering since ' + esc(artifact.covering_since) +
              ' · ' + projCount + ' project' + (projCount === 1 ? '' : 's');
    } else {
      cover = projCount + ' project' + (projCount === 1 ? '' : 's');
    }
    return `
    <div class="brief-head">
      <div class="brief-l">
        <div class="brief-date" id="brief-date">${esc(dateStr)}</div>
        <div class="brief-cover" id="brief-cover">${cover}</div>
      </div>
    </div>`;
  }

  // ── skeleton ──────────────────────────────────────────────────────────────
  function renderSkeleton(date){
    return `<div class="brief-skeleton">
      ${renderKpis({})}
      <div class="sec"><div class="sec-hdr"><i class="ti ti-moon-stars"></i> Ran overnight</div>
        <div class="loading-state"><i class="ti ti-loader-2"></i> Loading…</div></div>
      <div class="sec"><div class="sec-hdr"><i class="ti ti-hourglass-high"></i> Waiting on you</div>
        <div class="loading-state"><i class="ti ti-loader-2"></i> Loading…</div></div>
    </div>`;
  }

  // ── KPI strip ─────────────────────────────────────────────────────────────
  function renderKpis(gk){
    const n = v => (v == null ? 0 : v);
    return `
    <div class="status-bar">
      <div class="stat-cell"><span class="stat-v g">${n(gk.sprints_shipped)}</span><span class="stat-l">Sprints shipped</span></div>
      <div class="stat-cell"><span class="stat-v">${n(gk.tickets_done)}</span><span class="stat-l">Tickets done</span></div>
      <div class="stat-cell"><span class="stat-v">${n(gk.in_progress)}</span><span class="stat-l">In progress</span></div>
      <div class="stat-cell"><span class="stat-v a">${n(gk.needs_your_call)}</span><span class="stat-l">Need your call</span></div>
    </div>`;
  }

  // ── ran overnight / waiting on you ────────────────────────────────────────
  function _briefLinkHref(entry){
    const repo = _repoBySlug[entry.project] || '';
    if (entry.summary_issue_number && repo){
      return 'https://github.com/' + repo + '/issues/' + entry.summary_issue_number;
    }
    return '/project/' + encodeURIComponent(entry.project || '') + '/sprint-mgmt';
  }

  function renderRanOvernight(list){
    if (!list || !list.length) return '';
    const rows = list.map(e => {
      const outcome = String(e.outcome || '').toLowerCase();
      const cls = ['success','failure','partial'].includes(outcome) ? outcome : 'partial';
      const ic = outcome === 'success' ? 'ti-circle-check'
               : outcome === 'failure' ? 'ti-alert-triangle' : 'ti-progress-check';
      const proj = e.project
        ? `<span class="planner-meta"><span class="mono">${esc(e.project)}</span></span>` : '';
      const external = (e.summary_issue_number && _repoBySlug[e.project])
        ? ' target="_blank" rel="noopener"' : '';
      return `
        <div class="planner-row">
          <span class="outcome-badge ${cls}"><i class="ti ${ic}" style="font-size:10px"></i>${esc(outcome || 'ran')}</span>
          <span class="label">${esc(prettyLabel(e.label))}</span>
          ${proj}
          <a class="planner-link planner-spacer" href="${esc(_briefLinkHref(e))}"${external}>Sprint brief <i class="ti ti-arrow-up-right" style="font-size:11px"></i></a>
        </div>`;
    });
    return `
    <div class="sec">
      <div class="sec-hdr"><i class="ti ti-moon-stars"></i> Ran overnight <span class="count">${list.length}</span></div>
      ${_briefCollapsibleRows(rows, 'ran')}
    </div>`;
  }

  function _briefCollapsibleRows(rowsArr, id){
    if (rowsArr.length <= 3) return `<div class="planner-list">${rowsArr.join('')}</div>`;
    const head = rowsArr.slice(0, 3).join('');
    const rest = rowsArr.slice(3).join('');
    const n = rowsArr.length - 3;
    return `<div class="planner-list">${head}</div>
      <div class="planner-list planner-more" id="${id}-more" style="display:none">${rest}</div>
      <button type="button" class="planner-see-more" id="${id}-btn" onclick="_briefToggleMore('${id}', ${n})">See ${n} more <i class="ti ti-chevron-down"></i></button>`;
  }
  function _briefToggleMore(id, n){
    const more = document.getElementById(id + '-more');
    const btn = document.getElementById(id + '-btn');
    if (!more) return;
    const show = more.style.display === 'none';
    more.style.display = show ? '' : 'none';
    if (btn) btn.innerHTML = show
      ? 'See less <i class="ti ti-chevron-up"></i>'
      : `See ${n} more <i class="ti ti-chevron-down"></i>`;
  }

  function renderWaitingOnYou(list){
    if (!list || !list.length) return '';
    const rows = list.map(w => {
      const hrs = (w.estimated_hours != null) ? w.estimated_hours : 0;
      const tc = w.ticket_count || 0;
      const proj = w.project ? ` · <span class="mono">${esc(w.project)}</span>` : '';
      return `
        <div class="planner-row">
          <span class="outcome-badge partial"><i class="ti ti-clock-pause" style="font-size:10px"></i>sign-off</span>
          <span class="label">${esc(prettyLabel(w.label))}</span>
          <span class="planner-meta">${tc} ticket${tc === 1 ? '' : 's'} · <span class="mono">~${esc(hrs)}h</span>${proj}</span>
          <a class="planner-link planner-spacer" href="/project/${esc(w.project || '')}/sprint-mgmt">Sign off <i class="ti ti-arrow-right" style="font-size:11px"></i></a>
        </div>`;
    });
    return `
    <div class="sec">
      <div class="sec-hdr"><i class="ti ti-hourglass-high"></i> Waiting on you <span class="count">${list.length}</span></div>
      ${_briefCollapsibleRows(rows, 'waiting')}
    </div>`;
  }

  // ── decisions ─────────────────────────────────────────────────────────────
  function _sprintLabelFor(slug, projects){
    const p = (projects || []).find(x => x.project === slug) || {};
    return (p.in_progress && p.in_progress.sprint_label) ||
           (p.shipped && p.shipped[0] && p.shipped[0].label) ||
           (p.up_next && p.up_next.label) || '';
  }

  function renderDecisions(decisions, projects){
    let rows = '';
    if (!decisions.length){
      rows = '<div class="dec-empty">Nothing needs your call right now.</div>';
    } else {
      decisions.forEach((dec, i) => {
        let ic = '<span class="dec-ic"><i class="ti ti-clipboard-text"></i></span>';
        let btn = '';
        const repo = _repoBySlug[dec.project] || dec.project;
        const label = dec.label || '';
        if (dec.type === 'run_ready'){
          ic = '<span class="dec-ic go"><i class="ti ti-player-play"></i></span>';
          btn = `<button class="dec-act primary" id="dec-${i}" onclick="runSprintAction('${esc(repo)}','${esc(label)}',${i})">Run sprint</button>`;
        } else if (dec.type === 'rework'){
          ic = '<span class="dec-ic red"><i class="ti ti-refresh"></i></span>';
          const sl = _sprintLabelFor(dec.project, projects);
          btn = `<button class="dec-act" id="dec-${i}" onclick="reviewReworkAction('${esc(repo)}','${esc(sl)}',${i})">Review</button>`;
        } else if (dec.type === 'branch_cleanup'){
          ic = '<span class="dec-ic"><i class="ti ti-git-branch-deleted"></i></span>';
          btn = `<button class="dec-act" id="dec-${i}" onclick="cleanupBranchesAction('${esc(repo)}',${i})">Clean up</button>`;
        } else {
          ic = '<span class="dec-ic"><i class="ti ti-clipboard-plus"></i></span>';
          btn = `<a class="dec-act" href="/project/${esc(dec.project)}/sprint-mgmt">Open</a>`;
        }
        rows += `
        <div class="dec-row">
          ${ic}
          <span class="dec-txt"><span class="mono">${esc(dec.project)}</span> — ${esc(dec.suggested_action)}</span>
          ${btn}
        </div>`;
      });
    }
    return `
    <div class="sec">
      <div class="sec-hdr"><i class="ti ti-gavel"></i> Needs your decision <span class="count">${decisions.length}</span></div>
      <div class="decisions">${rows}</div>
    </div>`;
  }

  // ── suggested next ────────────────────────────────────────────────────────
  function renderSuggestedNext(list){
    if (!list || !list.length) return '';
    const rows = list.map(function(s){
      const slug = s.slug || '';
      const href = '/project/' + encodeURIComponent(slug) + '/roadmap';
      const ic = s.type === 'look_ahead' ? 'ti-arrow-right' : 'ti-bulb';
      const badge = s.type === 'look_ahead'
        ? '<span class="outcome-badge partial" style="font-size:9px;padding:1px 6px"><i class="ti ti-arrow-right" style="font-size:9px"></i>look-ahead</span>'
        : '';
      return `
        <div class="planner-row">
          <i class="ti ${ic}" style="font-size:13px;color:var(--text-muted);flex-shrink:0"></i>
          ${badge}
          <span style="flex:1;font-size:13px;color:var(--text)">${esc(s.text || '')}</span>
          <a class="planner-link planner-spacer" href="${esc(href)}">Roadmap <i class="ti ti-arrow-up-right" style="font-size:11px"></i></a>
        </div>`;
    }).join('');
    return `
    <div class="sec">
      <div class="sec-hdr"><i class="ti ti-stars"></i> Suggested next <span class="count">${list.length}</span></div>
      <div class="planner-list">${rows}</div>
    </div>`;
  }

  // ── project brief blocks ──────────────────────────────────────────────────
  function renderProjectsShell(projects, available){
    const artifactSlugs = new Set((projects || []).map(p => p.project));
    const liveSlugs = Object.keys(_repoBySlug);
    const mergedSlugs = [...new Set([...artifactSlugs, ...liveSlugs])].sort();
    const bySlug = {};
    (projects || []).forEach(p => { if (p.project) bySlug[p.project] = p; });
    const mergedProjects = mergedSlugs.map(slug => bySlug[slug] || {
      project: slug,
      in_progress: null,
      shipped: [],
      blocked: [],
      recent_activity: [],
      _live_only: true,
    });

    let blocks = '';
    if (!mergedProjects.length){
      const _addCta = '<a class="btn btn-primary" href="/static/home-preview.html" onclick="return openAdd(event)">Add new project</a>';
      blocks = available
        ? '<div class="empty-state"><i class="ti ti-folder-off"></i><div>No projects to report on for this date.</div>' + _addCta + '</div>'
        : '<div class="empty-state"><i class="ti ti-clipboard-off"></i><div>No brief was stored for this date.</div>' + _addCta + '</div>';
    } else {
      blocks = mergedProjects.map(renderProject).join('');
    }
    return `
    <div class="sec">
      <div class="sec-hdr"><i class="ti ti-clipboard-text"></i> Projects <span class="count">${mergedProjects.length}</span></div>
      ${blocks}
      <a class="add-proj" href="/static/home-preview.html" onclick="return openAdd(event)" aria-label="Add new project"><i class="ti ti-plus" aria-hidden="true"></i> Add new project</a>
    </div>`;
  }

  function _cardMeta(p){
    const pr = (p.in_progress && p.in_progress.progress) || {};
    const pct = pr.percent != null ? esc(pr.percent) + '%' : null;
    const acts = p.recent_activity || [];
    const last = acts[0];
    const lastTime = last && last.time ? new Date(last.time) : null;
    const lastFmt = lastTime && !isNaN(lastTime)
      ? String(lastTime.getMonth()+1).padStart(2,'0') + '/' + String(lastTime.getDate()).padStart(2,'0') + ' ' +
        String(lastTime.getHours()).padStart(2,'0') + ':' + String(lastTime.getMinutes()).padStart(2,'0')
      : null;
    const items = [];
    if (pct) items.push(`<span class="card-meta-item"><i class="ti ti-progress" style="font-size:10px" aria-hidden="true"></i>${pct}</span>`);
    if (lastFmt) items.push(`<span class="card-meta-item"><i class="ti ti-clock" style="font-size:10px" aria-hidden="true"></i>${esc(lastFmt)}</span>`);
    if (!items.length) return '';
    return `<div class="card-meta" aria-label="Progress and activity">${items.join('')}</div>`;
  }

  function _statusPill(p){
    const ip = p.in_progress;
    if (ip && ip.sprint_label){
      const lbl = prettyLabel(ip.sprint_label);
      return `<span class="pbstatus run"><span class="d"></span> ${esc(lbl)} running</span>`;
    }
    if ((p.blocked || []).length){
      return '<span class="pbstatus blocked">blocked</span>';
    }
    return '<span class="pbstatus idle">idle</span>';
  }

  function prettyLabel(label){
    const m = /^sprint-(\d+)$/.exec(String(label || ''));
    return m ? ('Sprint ' + m[1]) : String(label || '');
  }

  function _statusLine(p){
    const ip = p.in_progress;
    if (ip && ip.sprint_label){
      const t = ip.current_ticket || {};
      const tnum = t.issue_number ? `<span class="mono">#${esc(t.issue_number)}</span> ` : '';
      const ttitle = esc(t.title || '');
      const agent = ip.active_agent ? `<span class="agent-tag">${esc(String(ip.active_agent).toUpperCase())}</span>` : '';
      const pr = ip.progress || {};
      const pct = `<span class="pb-pct">${pr.percent || 0}% · ${pr.done || 0}/${pr.total || 0}</span>`;
      return `<div class="pb-statusline run"><span class="pulse"></span>${tnum}${ttitle} ${agent}${pct}</div>`;
    }
    const last = (p.shipped || [])[0];
    let txt = 'idle';
    if (last && last.label){
      txt = 'idle · last shipped <span class="mono">' + esc(prettyLabel(last.label)) + '</span>';
    } else {
      txt = 'idle, last shipped <span class="mono">—</span>';
    }
    return `<div class="pb-statusline"><i class="ti ti-circle-check" style="color:var(--text-sub)"></i> ${txt}</div>`;
  }

  function _shippedDetail(p){
    const last = (p.shipped || [])[0];
    if (!last){
      return '<div class="muted">No sprint shipped in this window.</div>';
    }
    const cnt = [];
    if (last.pr_number != null) cnt.push('PR #' + esc(last.pr_number));
    if (last.duration != null) cnt.push(esc(Math.round(last.duration / 60)) + 'm');
    const feats = (last.features || []).map(f =>
      `<div class="feat"><span class="plus">+</span> ${esc(f)}</div>`).join('') ||
      '<div class="muted">No feature detail recorded.</div>';
    const goal = last.goal ? (' — ' + esc(last.goal)) : '';
    return `
      <div class="relbox">
        <div class="rel-name">${esc(prettyLabel(last.label))}${goal} <span class="cnt">${cnt.join(' · ')}</span></div>
        ${feats}
      </div>`;
  }

  const HOME_ACTIVITY_LIMIT = 5;

  function _timeline(p){
    const acts = p.recent_activity || [];
    if (!acts.length){
      return '<div class="timeline"><div class="tl-row"><span class="tl-txt muted">No recent activity.</span></div></div>';
    }
    const shown = acts.slice(0, HOME_ACTIVITY_LIMIT);
    const rows = shown.map(a => {
      const src = String(a.source || '').toLowerCase();
      const badge = src === 'github' ? 'github' : 'agent';
      const lbl = (a.source || 'EVENT').toUpperCase();
      const _tld = a.time ? new Date(a.time) : null;
      const timeFmt = _tld && !isNaN(_tld)
        ? String(_tld.getHours()).padStart(2,'0') + ':' + String(_tld.getMinutes()).padStart(2,'0')
        : '';
      return `<div class="tl-row"><span class="tl-time">${esc(timeFmt)}</span><span class="tl-badge ${badge}">${esc(lbl)}</span><span class="tl-txt">${esc(a.message || '')}</span></div>`;
    }).join('');
    const foot = `<div class="tl-foot"><a href="/project/${esc(p.project)}/logs">View all in Logs →</a></div>`;
    return `<div class="timeline">${rows}${foot}</div>`;
  }

  function renderProject(p){
    const slug = p.project;
    return `
      <div class="pbrief${_bottomHidden(slug) ? ' hide-bottom' : ''}" data-slug="${esc(slug)}">
        <div class="pbrief-head">
          ${_projectTitleLinkHtml(slug)}
          <a class="pb-milestone" id="ms-${esc(slug)}" href="/project/${esc(slug)}/roadmap"
             title="Active milestone — open Roadmap"
             aria-label="Active milestone progress, open Roadmap tab">
            <i class="ti ti-flag-3"></i>
            <span class="pb-ms-name"></span>
            <span class="pb-ms-count"></span>
          </a>
          ${_cardMeta(p)}
          ${_statusPill(p)}
          <button class="pb-bottom-toggle" title="Hide/show shipped detail and to-do"
                  aria-label="Toggle bottom row" onclick="toggleBottom('${esc(slug)}')">
            <i class="ti ti-chevron-up"></i></button>
        </div>

        <div class="pb-grid">
          <div class="pb-cell pb-cell-summary">
            <div class="pb-summary">
              <span class="pb-sum-ic"><i class="ti ti-clipboard-text"></i></span>
              <div class="pb-sum-body">
                <span class="pb-sum-tag"><i class="ti ti-sparkles" style="font-size:9px"></i> AI summary</span>
                <div class="pb-sum-text" id="sum-${esc(slug)}">${summaryLoadingHtml()}</div>
              </div>
            </div>
            ${_statusLine(p)}
          </div>
          <div class="pb-cell pb-cell-todo">
            <div class="todo" id="todo-${esc(slug)}" data-project="${esc(slug)}"></div>
          </div>
          <div class="pb-cell pb-cell-shipped">
            <div class="drill-sec"><i class="ti ti-rocket" style="font-size:12px"></i> Shipped detail</div>
            ${_shippedDetail(p)}
          </div>
          <div class="pb-cell pb-cell-activity">
            <div class="drill-sec"><i class="ti ti-timeline-event" style="font-size:12px"></i> Recent activity</div>
            ${_timeline(p)}
          </div>
        </div>

        <div class="pb-foot">
          <a class="open-proj" href="/project/${esc(slug)}/sprint-mgmt" aria-label="Open ${esc(slug)} project">${esc(slug)} <i class="ti ti-arrow-right" style="font-size:12px" aria-hidden="true"></i></a>
        </div>
      </div>`;
  }

  async function loadProjectSummary(slug, date){
    const el = document.getElementById('sum-' + slug);
    if (!el) return;
    el.innerHTML = summaryLoadingHtml();
    try {
      const r = await fetch('/api/projects/' + encodeURIComponent(slug) +
                            '/brief/summary?date=' + encodeURIComponent(date));
      const data = await r.json();
      el.textContent = data.summary || 'No summary available.';
    } catch(_) {
      el.textContent = 'Summary unavailable.';
    }
  }

  // ── date navigation ───────────────────────────────────────────────────────
  function _go(date){
    const url = new URL(window.location.href);
    if (date) url.searchParams.set('date', date);
    else url.searchParams.delete('date');
    window.history.replaceState({}, '', url);
    loadBrief(date);
  }
  function gotoPrevDay(){
    const dt = parseDate(_curDate || todayIso());
    dt.setDate(dt.getDate() - 1);
    _go(fmtIso(dt));
  }
  function gotoToday(){ _go(null); }
  function onDatePick(ev){
    const v = ev.target.value;
    if (v) _go(v);
  }

  // ── decision actions ──────────────────────────────────────────────────────
  function _busy(id, text){
    const b = document.getElementById('dec-' + id);
    if (b){ b.disabled = true; b.textContent = text; }
    return b;
  }
  function _done(b, text){ if (b){ b.textContent = text; } }
  function _fail(b, text, enabled){ if (b){ b.textContent = text; b.disabled = !enabled; } }

  async function runSprintAction(repo, label, id){
    const b = _busy(id, 'Starting…');
    try {
      const r = await fetch('/api/sprints/run', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({project: repo, sprint_label: label}),
      });
      if (r.ok || r.status === 202){ _done(b, 'Started ✓'); }
      else { _fail(b, 'Retry', true); }
    } catch(_) { _fail(b, 'Retry', true); }
  }

  async function reviewReworkAction(repo, label, id){
    const b = _busy(id, 'Reviewing…');
    if (!label){ _fail(b, 'Review', true); return; }
    try {
      const r = await fetch('/api/sprints/' + encodeURIComponent(label) +
                            '/rerun-preview?project=' + encodeURIComponent(repo));
      if (r.ok){
        const data = await r.json().catch(() => ({}));
        const n = (data.tickets && data.tickets.length) || (data.rework && data.rework.length) || 0;
        _done(b, n ? ('Review (' + n + ')') : 'Reviewed ✓');
      } else { _fail(b, 'Review', true); }
    } catch(_) { _fail(b, 'Review', true); }
  }

  async function cleanupBranchesAction(repo, id){
    const b = _busy(id, 'Scanning…');
    try {
      const scan = await fetch('/scan-stale-branches?repo=' + encodeURIComponent(repo));
      if (!scan.ok){ _fail(b, 'Clean up', true); return; }
      const sd = await scan.json();
      const branches = [];
      (sd.sprints || sd.groups || []).forEach(g => (g.branches || []).forEach(x => branches.push(x)));
      (sd.branches || []).forEach(x => branches.push(x));
      if (!branches.length){ _done(b, 'Nothing stale ✓'); return; }
      const dry = await (await fetch('/cleanup-stale-branches', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({repo, branches, confirm: false}),
      })).json();
      const toDelete = dry.to_delete || [];
      if (!toDelete.length){ _done(b, 'Nothing to delete ✓'); return; }
      if (!confirm('Delete ' + toDelete.length + ' merged branch(es)?\n\n' + toDelete.join('\n'))){
        _fail(b, 'Clean up', true); return;
      }
      const res = await fetch('/cleanup-stale-branches', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({repo, branches, confirm: true}),
      });
      _done(b, res.ok ? 'Cleaned ✓' : 'Retry');
      if (!res.ok && b) b.disabled = false;
    } catch(_) { _fail(b, 'Clean up', true); }
  }

  function openAdd(ev){
    if (typeof openAddProjectFlow === 'function' &&
        document.getElementById('apm-backdrop')){
      ev.preventDefault();
      openAddProjectFlow();
      return false;
    }
    return true;
  }

  init();
  </script>
</body>
</html>
